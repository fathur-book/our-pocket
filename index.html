  <div class="field"><label for="fpDesc">Keterangan (opsional)</label><input id="fpDesc" type="text" value="${esc(p.description||'')}"></div>
  <div class="form2"><div class="field"><label for="fpTarget">Target (Rp)</label>${amtInput('fpTarget',p.targetAmount)}</div><div class="field"><label for="fpCur">Sudah terkumpul (Rp)</label>${amtInput('fpCur',p.currentAmount)}</div></div>
  <div class="form2"><div class="field"><label for="fpDate">Target bulan</label><input id="fpDate" type="month" value="${esc(p.targetDate||'')}"></div><div class="field"><label for="fpHint">Saran top up / bulan</label>${amtInput('fpHint',p.monthlyHint)}</div></div>`;
  modalShell(id?'Ubah Pocket':'Buat Pocket', body, `<button class="btn btn-emerald" style="width:100%;padding:12px" onclick="savePocket('${id||''}')">Simpan</button>`);
  document.getElementById('fpName').focus();
}
function savePocket(id){
  const name=fv('fpName').trim(), targetAmount=amtVal('fpTarget');
  if(!name||targetAmount<=0){ toast('Isi nama dan target pocket dulu ya.'); return; }
  const data={name,description:fv('fpDesc').trim(),targetAmount,currentAmount:amtVal('fpCur'),targetDate:fv('fpDate'),monthlyHint:amtVal('fpHint')}, snap=snapshot();
  if(id) pockets=pockets.map(p=> p.id===id? {...p,...data}:p);
  else pockets=[...pockets,{id:newId('pock'),icon:'piggy-bank',...data}];
  settingsSaved(id?`Pocket "${name}" diperbarui.`:`Pocket "${name}" dibuat.`,snap);
}
function deletePocket(id){
  const p=pockets.find(x=>x.id===id); if(!p) return;
  if(p.currentAmount>0&&!confirm(`"${p.name}" masih berisi ${fmt(p.currentAmount)}. Hapus pocket ini? Saldonya tidak lagi dihitung sebagai tabungan.`)) return;
  const snap=snapshot(); pockets=pockets.filter(x=>x.id!==id); render(); toastUndo(`Pocket "${p.name}" dihapus.`,snap);
}

function openBillForm(id){
  const r=recurringItems.find(x=>x.id===id)||{name:'',categoryId:'cat_utilities',dueDay:15,expectedAmount:0,note:''};
  const body=`<div class="field"><label for="nrName">Nama tagihan / langganan</label><input id="nrName" type="text" value="${esc(r.name)}" placeholder="cth. Netflix, Internet, Kost…"></div>
  <div class="field"><label for="nrCat">Kategori</label>${catSelect('nrCat',r.categoryId)}</div>
  <div class="form2"><div class="field"><label for="nrDay">Jatuh tempo (tgl 1–31)</label><input id="nrDay" type="number" min="1" max="31" value="${r.dueDay}"></div><div class="field"><label for="nrAmt">Perkiraan nominal (Rp)</label>${amtInput('nrAmt',r.expectedAmount)}</div></div>
  <div class="field"><label for="nrNote">Catatan (opsional)</label><input id="nrNote" type="text" value="${esc(r.note||'')}" placeholder="cth. Auto-debit Jago"></div>`;
  modalShell(id?'Ubah Tagihan Rutin':'Tambah Tagihan Rutin', body, `<button class="btn btn-emerald" style="width:100%;padding:12px" onclick="saveBill('${id||''}')">Simpan</button>`);
  document.getElementById('nrName').focus();
}
function createRecurring(){ saveBill(''); }
function saveBill(id){
  const name=fv('nrName').trim(), amt=amtVal('nrAmt');
  if(!name||amt<=0){ toast('Isi nama dan nominal yang valid dulu ya.'); return; }
  const data={name,categoryId:fv('nrCat'),dueDay:Math.min(31,Math.max(1,parseInt(fv('nrDay'),10)||15)),expectedAmount:amt,note:fv('nrNote').trim()}, snap=snapshot();
  if(id) recurringItems=recurringItems.map(r=> r.id===id? {...r,...data}:r);
  else recurringItems=[...recurringItems,{id:newId('rec'),...data,actualAmount:null,status:'upcoming',statusMonth:currentMonth()}];
  recurringItems.sort((a,b)=>a.dueDay-b.dueDay);
  settingsSaved(id?`Tagihan "${name}" diperbarui.`:`Tagihan baru ditambahkan: "${name}"`,snap);
}
function deleteBill(id){
  const r=recurringItems.find(x=>x.id===id); if(!r) return;
  const snap=snapshot(); recurringItems=recurringItems.filter(x=>x.id!==id); render(); toastUndo(`Tagihan "${r.name}" dihapus (transaksi lama tetap ada).`,snap);
}

function openEssentialForm(id){
  const e=essentials.find(x=>x.id===id)||{name:'',unitPrice:0,targetQty:1,categoryId:'cat_food'};
  const body=`<div class="field"><label for="feName">Nama item</label><input id="feName" type="text" value="${esc(e.name)}" placeholder="cth. Telur, Beras, Sabun"></div>
  <div class="form2"><div class="field"><label for="fePrice">Harga per beli (Rp)</label>${amtInput('fePrice',e.unitPrice)}</div><div class="field"><label for="feQty">Berapa kali / bulan</label><input id="feQty" type="number" min="1" max="99" value="${e.targetQty}"></div></div>
  <div class="field"><label for="feCat">Kategori</label>${catSelect('feCat',e.categoryId)}</div>`;
  modalShell(id?'Ubah Item Essentials':'Tambah Item Essentials', body, `<button class="btn btn-emerald" style="width:100%;padding:12px" onclick="saveEssential('${id||''}')">Simpan</button>`);
  document.getElementById('feName').focus();
}
function saveEssential(id){
  const name=fv('feName').trim(), unitPrice=amtVal('fePrice'), targetQty=Math.min(99,Math.max(1,parseInt(fv('feQty'),10)||1));
  if(!name||unitPrice<=0){ toast('Isi nama dan harga dulu ya.'); return; }
  const data={name,unitPrice,targetQty,categoryId:fv('feCat')}, snap=snapshot();
  if(id) essentials=essentials.map(e=> e.id===id? {...e,...data}:e);
  else essentials=[...essentials,{id:newId('ess'),...data}];
  settingsSaved(id?`"${name}" diperbarui.`:`"${name}" ditambahkan ke Essentials.`,snap);
}
function deleteEssential(id){
  const e=essentials.find(x=>x.id===id); if(!e) return;
  const snap=snapshot(); essentials=essentials.filter(x=>x.id!==id); render(); toastUndo(`"${e.name}" dihapus dari Essentials.`,snap);
}
function setMainAccount(id){ const snap=snapshot(); settings={...settings,mainAccountId:id}; render(); toastUndo('Rekening utama diperbarui.',snap); }

function settingsList(title,sub,addLabel,addFn,rows,empty){
  return `<div class="card"><div class="set-head"><div><h3>${title}</h3><p class="sub">${sub}</p></div><button class="btn btn-dark btn-sm" onclick="${addFn}">${addLabel}</button></div>
  ${rows.length? rows.join('') : `<p class="set-empty">${empty}</p>`}</div>`;
}
const setRow=(main,meta,editFn,delFn)=>`<div class="set-row"><div style="min-width:0"><strong>${main}</strong><div class="set-meta">${meta}</div></div><div class="set-actions"><button class="btn btn-sm" onclick="${editFn}">Ubah</button><button class="icon-btn" aria-label="Hapus" onclick="${delFn}">🗑</button></div></div>`;
function renderSettings(){
  const main=mainAccountId();
  document.getElementById('view-settings').innerHTML=`<div class="set-grid">
  ${settingsList('Rekening & Kartu','Semua rekening, e-wallet dan kartu kredit yang kamu punya.','+ Rekening','openAccountForm()',
    accounts.map(a=>setRow(`${esc(a.name)}${a.id===main?' <span class="badge ok" style="margin-left:4px">utama</span>':''}`,`${esc((ACC_TYPES[a.type]||ACC_TYPES.bank).label)} · ${fmt(a.balance)}${a.id!==main&&a.type!=='credit'?` · <button class="link-btn" style="font-size:11px" onclick="setMainAccount('${a.id}')">Jadikan utama</button>`:''}`,`openAccountForm('${a.id}')`,`deleteAccount('${a.id}')`)),
    'Belum ada rekening. Tambahkan rekening tempat gaji masuk terlebih dulu.')}
  ${settingsList('Saving Pockets','Tabungan dengan target, dipisahkan dari uang belanja.','+ Pocket','openPocketForm()',
    pockets.map(p=>setRow(esc(p.name),`${fmt(p.currentAmount)} dari ${fmt(p.targetAmount)}${p.targetDate?' · target '+esc(p.targetDate):''}`,`openPocketForm('${p.id}')`,`deletePocket('${p.id}')`)),
    'Belum ada pocket.')}
  ${settingsList('Tagihan Rutin','Tagihan bulanan dengan tanggal jatuh tempo.','+ Tagihan','openBillForm()',
    recurringItems.map(r=>setRow(esc(r.name),`Tgl ${r.dueDay} · ${fmt(r.expectedAmount)}`,`openBillForm('${r.id}')`,`deleteBill('${r.id}')`)),
    'Belum ada tagihan rutin.')}
  ${settingsList('Daftar Essentials','Belanja kebutuhan rutin per bulan.','+ Item','openEssentialForm()',
    essentials.map(e=>setRow(esc(e.name),`${fmt(e.unitPrice)} × ${e.targetQty}/bulan = ${fmt(e.unitPrice*e.targetQty)}`,`openEssentialForm('${e.id}')`,`deleteEssential('${e.id}')`)),
    'Belum ada item Essentials.')}
  <div class="card"><div class="set-head"><div><h3>Budget Kategori</h3><p class="sub">Batas belanja bebas per bulan (di luar tagihan & Essentials).</p></div><button class="btn btn-sm" onclick="openBudgetModal()">Ubah</button></div>${categories.filter(c=>c.type==='expense'&&budgetOf(c.id)).map(c=>`<div class="set-row"><span>${esc(c.name)}</span><strong>${fmt(budgetOf(c.id))}</strong></div>`).join('')||'<p class="set-empty">Belum ada budget.</p>'}</div>
  <div class="card"><div class="set-head"><div><h3>Gajian</h3><p class="sub">Safe-to-Spend menyisihkan kebutuhan sampai tanggal ini.</p></div><button class="btn btn-sm" onclick="openPaydayModal()">Ubah</button></div><p style="margin:0;font-size:13px">Setiap tanggal <strong>${settings.payday}</strong></p></div>
  </div>`;
}
const SETUP_STEPS=[
  {id:'acc',  title:'Tambah rekening', sub:'Rekening tempat gaji masuk, e-wallet, dan kartu kredit.', done:()=>accounts.length>0, act:'openAccountForm()', optional:false},
  {id:'opening',title:'Catat saldo awal', sub:'Uang yang bisa dibelanjakan saat ini, supaya Safe-to-Spend mulai dari angka yang benar.', done:()=>!!openingTx(), act:'openOpeningBalance()', optional:false},
  {id:'payday',title:'Atur tanggal gajian', sub:'Safe-to-Spend dihitung sampai tanggal ini.', done:()=>!!settings.paydaySet, act:'openPaydayModal()', optional:false},
  {id:'bills',title:'Tambah tagihan rutin', sub:'Kos, internet, listrik, langganan…', done:()=>recurringItems.length>0, act:'openBillForm()', optional:true},
  {id:'ess',  title:'Buat daftar Essentials', sub:'Belanja kebutuhan bulanan (beras, telur…).', done:()=>essentials.length>0, act:'openEssentialForm()', optional:true},
  {id:'pock', title:'Buat saving pocket', sub:'Dana darurat, liburan, atau target lain.', done:()=>pockets.length>0, act:'openPocketForm()', optional:true},
  {id:'budget',title:'Atur budget kategori', sub:'Batas belanja bebas per bulan.', done:()=>Object.keys(settings.budgets||{}).length>0, act:'openBudgetModal()', optional:true},
];
function setupState(){ const skip=settings.setupSkip||[]; return SETUP_STEPS.map(st=>({...st,isDone:st.done(),skipped:skip.includes(st.id)})); }
function setupComplete(){ return setupState().every(st=>st.isDone||st.skipped); }
function skipSetup(id){ const snap=snapshot(); settings={...settings,setupSkip:[...new Set([...(settings.setupSkip||[]),id])]}; render(); toastUndo('Langkah dilewati — bisa diatur kapan saja di Pengaturan.',snap); }
function dismissSetup(){ const snap=snapshot(); settings={...settings,setupDismissed:true}; render(); toastUndo('Panduan disembunyikan.',snap); }
function renderSetupChecklist(){
  const st=setupState(), done=st.filter(x=>x.isDone||x.skipped).length, next=st.find(x=>!x.isDone&&!x.skipped);
  return `<div class="card setup"><div class="set-head"><div><h3>Siapkan FlowPocket</h3><p class="sub">${done} dari ${st.length} langkah selesai · angka Safe-to-Spend makin akurat di setiap langkah.</p></div>${accounts.length?'<button class="link-btn" onclick="dismissSetup()">Sembunyikan</button>':''}</div>
  <div class="bar sm" style="margin:4px 0 6px"><i style="width:${Math.round(done/st.length*100)}%"></i></div>
  ${st.map(x=>`<div class="setup-row ${x===next?'next':''}"><span class="setup-check ${x.isDone?'ok':''}">${x.isDone?'✓':x.skipped?'–':''}</span><div style="flex:1;min-width:0"><strong>${x.title}</strong><div class="set-meta">${x.skipped?'Dilewati':x.sub}</div></div>${x.isDone?'':`<span class="set-actions">${x.optional&&!x.skipped?`<button class="link-btn" style="font-size:11px" onclick="skipSetup('${x.id}')">Lewati</button>`:''}<button class="btn btn-sm ${x===next?'btn-dark':''}" onclick="${x.act}">${x.skipped?'Atur':'Mulai'}</button></span>`}</div>`).join('')}
  </div>`;
}
function renderWelcome(){
  return `<div class="card welcome"><div class="brand-icon" style="margin:0 auto 12px"><i data-lucide="wallet"></i></div>
  <h3 style="font-size:18px">Selamat datang di FlowPocket</h3>
  <p class="sub" style="max-width:420px;margin:6px auto 18px">Mulai dengan menambahkan rekening tempat gaji masuk. Setelah itu, atur tanggal gajian, pocket tabungan, tagihan, dan daftar Essentials kapan saja di Pengaturan.</p>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn btn-dark" onclick="openAccountForm()">+ Tambah rekening pertama</button><button class="btn" onclick="goTab('settings')">Buka Pengaturan</button></div></div>`;
}

/* Pockets */
let pocketCtx=null;
function openPocketAction(pid,mode){
  if(needMainAccount()) return;
  const p=pockById(pid); if(!p) return; pocketCtx={pocket:p,mode};
  const body=`<p style="font-size:13px;margin:0 0 12px"><strong>${esc(p.name)}</strong> — terkumpul ${fmt(p.currentAmount)} dari target ${fmt(p.targetAmount)}<br><span style="color:var(--muted);font-size:12px">${mode==='topup'?`Dana dipindahkan dari ${esc((accById(mainAccountId())||{name:'rekening utama'}).name)} ke pocket ini — saldo rekening berkurang dan Safe-to-Spend turun.`:'Pengeluaran dari pocket dicatat terpisah dan tidak mengacaukan budget fleksibel bulanan.'}</span></p>
  <div class="field"><label for="pockAmt">Nominal (Rp)</label>${amtInput('pockAmt',mode==='topup'?p.monthlyHint:0,'250.000').replace('<input','<input class="big"')}</div>
  <div class="field"><label>Catatan (opsional)</label><input id="pockNote" type="text" placeholder="${mode==='topup'?'Top up '+esc(p.name):'Belanja dari '+esc(p.name)}"></div>`;
  modalShell(mode==='topup'?'Top Up Pocket':'Pakai Dana Pocket', body, `<button class="btn btn-emerald" style="width:100%;padding:12px" onclick="confirmPocketAction()">${mode==='topup'?'Pindahkan ke Pocket':'Catat Pengeluaran dari Pocket'}</button>`);
}
function confirmPocketAction(){
  if(!pocketCtx) return; const amt=parseAmt(document.getElementById('pockAmt').value); const note=document.getElementById('pockNote').value.trim(); const {pocket,mode}=pocketCtx;
  if(amt<=0){ toast('Nominal harus lebih dari nol.'); return; }
  if(mode!=='topup'&&pocket.currentAmount<=0){ toast(`${pocket.name} masih kosong — tidak ada dana untuk dipakai.`); return; }
  const snap=snapshot();
  if(mode==='topup'){ const mainId=mainAccountId(), moves=[{id:mainId,amount:-amt}]; adjBalance(mainId,-amt); pockets=pockets.map(p=> p.id===pocket.id? {...p,currentAmount:p.currentAmount+amt}:p); transactions=[{id:'tx_pock_'+Date.now(),date:todayISO(),title:note||`Tabung ke ${pocket.name}`,amount:amt,type:'transfer',categoryId:null,accountId:mainId,tag:'#pocket-save',pocketId:pocket.id,moves},...transactions]; toastUndo(`Berhasil memindahkan ${fmt(amt)} ke ${pocket.name}!`,snap); }
  else { const deduct=Math.min(pocket.currentAmount,amt); pockets=pockets.map(p=> p.id===pocket.id? {...p,currentAmount:p.currentAmount-deduct}:p); transactions=[{id:'tx_pock_spend_'+Date.now(),date:todayISO(),title:note||`Belanja dari ${pocket.name}`,amount:deduct,type:'expense',categoryId:'cat_shopping',accountId:null,tag:'#'+pocket.name.toLowerCase().replace(/\s+/g,'-'),pocketId:pocket.id},...transactions]; } // paid from savings: no account changes
  closeModal(); render();
  if(mode!=='topup') toastUndo(`Tercatat pengeluaran ${fmt(Math.min(pocket.currentAmount,amt))} dari ${pocket.name}.`,snap);
}
function payoffCredit(){
  if(needMainAccount()) return;
  const fin=financialSummary(); const amt=fin.creditFloatHolding; if(amt<=0) return;
  const main=accById(mainAccountId());
  if(!confirm(`Catat pelunasan semua kartu kredit sebesar ${fmt(amt)} dari ${main.name}?\n\nLakukan ini setelah kamu benar-benar membayar tagihannya di aplikasi bank.`)) return;
  const snap=snapshot();
  const creditPayoff=accounts.filter(a=>a.type==='credit'&&a.balance<0).map(a=>({id:a.id,amount:-a.balance}));
  accounts=accounts.map(a=>{ if(a.id===mainAccountId()) return {...a,balance:a.balance-amt}; if(a.type==='credit'&&a.balance<0) return {...a,balance:0}; return a; }); // cards in credit (refunds) keep their balance
  transactions=[{id:'tx_cc_'+Date.now(),date:todayISO(),title:'Pelunasan kartu kredit',amount:amt,type:'transfer',categoryId:null,accountId:mainAccountId(),tag:'#cc-payoff',pocketId:null,creditPayoff},...transactions];
  render(); toastUndo(`Kartu kredit lunas: ${fmt(amt)} dibayar dari ${main.name}.`,snap);
}
function deleteTx(id){
  const tx=transactions.find(t=>t.id===id); if(!tx) return;
  if(tx.type==='transfer'&&tx.pocketId&&!tx.fromPocket){ const p=pockById(tx.pocketId); if(p&&p.currentAmount<tx.amount){ toast(`${p.name} tinggal ${fmt(p.currentAmount)} — sebagian dana ini sudah dipakai. Hapus dulu pengeluaran dari pocket tersebut.`); return; } }
  const snap=snapshot();
  reverseTx(tx);
  transactions=transactions.filter(t=>t.id!==id);
  render(); toastUndo(`Entri "${tx.title}" dihapus — saldo terkait dikembalikan.`,snap);
}

/* Nav wiring */
document.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click',()=>goTab(b.dataset.tab)));
document.getElementById('fabBtn').addEventListener('click',()=>{ logState=freshLogState(); openLogger(); });
document.getElementById('quickLogTop').addEventListener('click',()=>{ logState=freshLogState(); openLogger(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
render();
initCloud();
</script>
</body>
</html>
