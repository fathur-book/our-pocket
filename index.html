<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%230f172a%22%2F%3E%3Cg%20transform%3D%22translate%284%204%29%22%20fill%3D%22none%22%20stroke%3D%22%2334d399%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M19%207V4a1%201%200%200%200-1-1H5a2%202%200%200%200%200%204h15a1%201%200%200%201%201%201v4h-3a2%202%200%200%200%200%204h3a1%201%200%200%200%201-1v-2a1%201%200%200%200-1-1%22%2F%3E%3Cpath%20d%3D%22M3%205v14a2%202%200%200%200%202%202h15a1%201%200%200%200%201-1v-4%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" />
<meta name="theme-color" content="#0f172a" />
<title>FlowPocket — Clarity-First Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#f8fafc; --border:#e2e8f0; --border2:#cbd5e1;
  --text:#0f172a; --muted:#64748b; --muted2:#94a3b8;
  --dark:#0f172a; --dark2:#1e293b; --dark-border:#334155;
  --emerald:#059669; --emerald-bg:#ecfdf5; --emerald-border:#a7f3d0; --emerald-text:#065f46;
  --amber:#d97706; --amber-bg:#fffbeb; --amber-border:#fde68a; --amber-text:#92400e;
  --indigo:#4f46e5; --indigo-bg:#eef2ff;
  --rose:#e11d48;
  --radius:20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --surface:#111827; --surface2:#0f172a; --border:#1f2937; --border2:#374151;
    --text:#f1f5f9; --muted:#94a3b8; --muted2:#64748b;
    --emerald-bg:#064e3b33; --emerald-border:#065f46; --emerald-text:#6ee7b7;
    --amber-bg:#78350f33; --amber-border:#92400e; --amber-text:#fcd34d;
    --indigo-bg:#312e8133;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:96px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.mono{font-family:'JetBrains Mono',monospace}
a{color:inherit}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-in{max-width:1440px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:40px;height:40px;border-radius:12px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center}
.brand-icon svg{width:20px;height:20px;color:#34d399}
.brand h1{font-size:17px;margin:0;letter-spacing:-.02em;line-height:1}
.brand p{margin:2px 0 0;font-size:11px;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
nav.tabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border);padding:4px;border-radius:14px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
nav.tabs button.active{background:var(--dark);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
nav.tabs button svg{width:15px;height:15px}
.safe-pill{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
main{max-width:1440px;margin:0 auto;padding:20px 24px 8px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:20px;letter-spacing:-.02em}
.page-head p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h3{margin:0;font-size:15px}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.hero{background:var(--dark);color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#05966955,transparent 70%)}
.hero .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;font-weight:700}
.hero .big{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.03em;margin:4px 0 0;line-height:1.05}
.pill-green{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#05966926;color:#6ee7b7;border:1px solid #05966944;font-size:11px;font-weight:700}
.btn-ghost-light{background:#ffffff1a;color:#e2e8f0;border:1px solid #ffffff22;padding:6px 10px;border-radius:9px;font-size:11px;font-weight:600}
.hero{container-type:inline-size}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:16px;position:relative;z-index:1}
.breakdown>*{background:#1e293bcc;border:1px solid var(--dark-border);border-radius:12px;padding:10px;min-width:0;text-align:left;width:100%;color:#fff}
.breakdown button{cursor:pointer}
.breakdown span{display:block;font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.breakdown strong{display:block;margin-top:3px;font-size:clamp(11px,2.1cqi,13px);white-space:nowrap}
@container (max-width:560px){.breakdown{grid-template-columns:repeat(2,minmax(0,1fr))}.breakdown>:first-child{grid-column:1/-1}}
.formula{margin-top:12px;background:#1e293b;border:1px solid var(--dark-border);border-radius:14px;padding:12px;font-size:12px;line-height:1.6;color:#cbd5e1;position:relative;z-index:1}
.bar{height:10px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--emerald);transition:width .4s}
.bar.amber>i{background:#f59e0b}.bar.dark>i{background:var(--dark)}
@media(prefers-color-scheme:dark){.bar.dark>i{background:#e2e8f0}}
.bar.sm{height:7px}
.progress-row{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid}
.badge.ok{background:var(--emerald-bg);color:var(--emerald-text);border-color:var(--emerald-border)}
.badge.warn{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-border)}
.ess-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.ess-tile{border:1px solid var(--border);background:var(--surface2);border-radius:14px;padding:12px;text-align:left;width:100%;transition:.15s}
.ess-tile:hover{background:var(--dark);color:#fff;border-color:var(--dark)}
.ess-tile:hover .t1{color:#6ee7b7}.ess-tile:hover .t3{color:#94a3b8;border-color:#334155}
.ess-tile .t1{font-size:10px;font-weight:800;color:var(--emerald);display:flex;justify-content:space-between}
.ess-tile h4{margin:5px 0 0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ess-tile .t3{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:10px;color:var(--muted)}
.ess-tile .t3 strong{display:block;font-size:12px;color:inherit}
.cat-row{margin-bottom:16px}.cat-row:last-child{margin-bottom:0}
.cat-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px}
.cat-name{display:flex;align-items:center;gap:8px;font-weight:700}
.cat-ico{width:28px;height:28px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.cat-ico svg{width:14px;height:14px}
.pocket-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pocket-mini{border:1px solid var(--border);background:var(--surface2);border-radius:16px;padding:14px}
.pocket-mini h4{margin:8px 0 2px;font-size:13px}
.pocket-mini p{margin:0;font-size:11px;color:var(--muted)}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700;color:var(--text)}
.btn:hover{border-color:var(--border2)}
.btn-dark{background:var(--dark);color:#fff;border-color:var(--dark)}
.btn-dark:hover{background:var(--emerald);border-color:var(--emerald)}
.btn-emerald{background:#059669;color:#fff;border-color:#059669}
.btn-sm{padding:6px 10px;font-size:11px;border-radius:9px}
.link-btn{background:none;border:0;font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:4px;padding:0}
.link-btn:hover{color:var(--text)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px}
.stat span{font-size:11px;color:var(--muted);font-weight:600}
.stat p{margin:5px 0 0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat small{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.stat.dark{background:var(--dark);color:#fff;border-color:var(--dark)}
.stat.dark span,.stat.dark small{color:#94a3b8}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
td{padding:12px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr.done{background:color-mix(in srgb, var(--emerald-bg) 45%, transparent)}
.num{text-align:right}.center{text-align:center}
.seg{display:inline-flex;gap:3px;background:var(--surface2);border:1px solid var(--border);padding:3px;border-radius:11px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:11px;font-weight:700;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rec-row{display:flex;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.rec-row:last-child{border-bottom:0}
.date-box{width:42px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;border:1px solid var(--border);background:var(--dark);color:#fff;flex-shrink:0}
.date-box small{font-size:8px;letter-spacing:.08em;opacity:.7}
.date-box.paid{background:var(--emerald-bg);color:var(--emerald-text);border-color:var(--emerald-border)}
.date-box.skipped{background:var(--surface2);color:var(--muted)}
.sweep{background:#064e3b;color:#fff;border-radius:22px;padding:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
@media(prefers-color-scheme:dark){.sweep{background:#065f46}}
.acc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.acc{border:1px solid var(--border);background:var(--surface2);border-radius:16px;padding:14px}
.acc.credit{background:var(--amber-bg);border-color:var(--amber-border)}
.acc-ico{width:36px;height:36px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center}
.acc-ico svg{width:16px;height:16px}
.searchbar{display:flex;gap:10px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted2)}
.search-wrap input{width:100%;padding:11px 12px 11px 36px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);font-size:13px;color:var(--text)}
select{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);font-size:12px;font-weight:600;color:var(--text)}
.tx-group{border:1px solid var(--border);border-radius:18px;overflow:hidden;background:var(--surface);margin-bottom:14px}
.tx-group-head{background:var(--surface2);padding:10px 16px;display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid var(--border)}
.tx-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.tx-row:last-child{border-bottom:0}
.tx-ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface2);border:1px solid var(--border)}
.tx-ico svg{width:16px;height:16px}
.tx-ico.green{background:var(--emerald-bg);color:var(--emerald-text);border-color:var(--emerald-border)}
.tx-ico.indigo{background:var(--indigo-bg);color:var(--indigo)}
.tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.icon-btn{border:0;background:transparent;color:var(--muted2);padding:6px;border-radius:8px}
.icon-btn:hover{color:var(--rose);background:#fff1f2}
.fab{position:fixed;right:18px;bottom:20px;z-index:40;display:flex;align-items:center;gap:6px;background:#059669;color:#fff;border:0;padding:12px 20px 12px 16px;border-radius:999px;font-weight:700;font-size:14px;line-height:1;box-shadow:0 8px 20px rgba(5,150,105,.3)}
.fab:hover{background:#047857}
.fab svg{width:18px;height:18px;stroke-width:2.5}
.ql-imports{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ql-imports .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;text-align:center}
.ql-imports svg{width:16px;height:16px;flex-shrink:0}
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-back{align-items:center;padding:16px}}
.modal{background:var(--surface);width:100%;max-width:460px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;border:1px solid var(--border)}
@media(min-width:640px){.modal{border-radius:22px}}
.modal-head{padding:10px 10px 10px 16px;border-bottom:1px solid var(--border);background:var(--surface2)}
.modal-close{width:40px;height:40px;flex-shrink:0;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;padding:0}
.modal-close:hover{border-color:var(--border2)}
.modal-close svg{width:20px;height:20px;stroke-width:2.4}
.modal-body{padding:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:14px}
.field input.big{font-size:20px;font-weight:800;padding:13px 14px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--surface2);border:1px solid var(--border);padding:3px;border-radius:11px}
.type-grid button{border:0;background:transparent;padding:8px 4px;border-radius:8px;font-size:11px;font-weight:800;color:var(--muted)}
.type-grid button.active{background:var(--dark);color:#fff}
.toast-undo{margin-left:6px;background:#ffffff1f;color:#6ee7b7;border:1px solid #ffffff33;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:800}
.rc-opt{border:1px solid var(--border);background:var(--surface2);border-radius:14px;padding:14px;margin-bottom:12px}
.rc-opt textarea{width:100%;margin-top:6px;padding:10px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;resize:vertical}
.rc-help{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.rc-row{border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:var(--surface)}
.rc-row.off{opacity:.5}
.rc-line{display:flex;gap:8px;align-items:center}
.rc-line input[type=text],.rc-line select{flex:1;min-width:0;padding:7px 9px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px}
.rc-line .rc-amt{flex:0 0 96px;text-align:right;font-weight:700}
.rc-sub{margin-top:6px;padding-left:24px}
.rc-sub select{font-size:12px}
.rc-qty{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex:0 0 auto}
.rc-qty input{width:52px!important;flex:0 0 52px!important;text-align:center}
.st-date{flex:0 0 46px;font-size:11px;font-weight:700;color:var(--muted)}
.st-linked{border-color:var(--emerald-border)!important;color:var(--emerald-text)!important}
.st-note{font-size:11px;color:var(--amber-text);margin-top:4px;padding-left:24px}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.set-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.set-head>div{min-width:0}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:13px}
.set-meta{font-size:11px;color:var(--muted);margin-top:2px}
.set-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.set-empty{font-size:12px;color:var(--muted);margin:0;padding:10px 0;border-top:1px solid var(--border)}
.welcome{text-align:center;padding:40px 20px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.set-grid{grid-template-columns:1fr}}
.auth-gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:26px 22px}
.acct{position:relative}
.acct-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:800;font-size:14px;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.acct-btn:hover{border-color:var(--border2)}
.sync-dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);background:var(--muted2)}

<script>
/* ============ DATA (dari file TSX asli) ============ */
/* Starts empty — the user adds accounts, pockets, bills and Essentials in Pengaturan. */
let accounts=[];
const categories=[
{id:'cat_food',name:'Food & Dining',type:'expense',icon:'utensils'},
{id:'cat_coffee',name:'Coffee & Snacks',type:'expense',icon:'coffee'},
{id:'cat_transport',name:'Transport & Fuel',type:'expense',icon:'car'},
{id:'cat_utilities',name:'Home & Utilities',type:'expense',icon:'zap'},
{id:'cat_subs',name:'Digital & AI Subs',type:'expense',icon:'repeat'},
{id:'cat_shopping',name:'Lifestyle & Gear',type:'expense',icon:'shopping-bag'},
{id:'cat_salary',name:'Primary Income',type:'income',icon:'briefcase'},
{id:'cat_freelance',name:'Side / Dividend',type:'income',icon:'trending-up'},
{id:'cat_opening',name:'Saldo awal',type:'income',icon:'wallet'}];
let essentials=[];
let pockets=[];
let recurringItems=[];
let transactions=[];

let activeTab='dashboard', showFormula=false, essentialsFilter='all';
let searchQuery='', filterType='all', filterCategory='all';
/* ============ DATES — everything derives from today() ============ */
// `?today=YYYY-MM-DD` in the URL pretends it is another day (handy for checking month rollover).
function today(){
  const q=new URLSearchParams(location.search).get('today');
  if(q&&/^\d{4}-\d{2}-\d{2}$/.test(q)){ const [y,m,d]=q.split('-').map(Number); return new Date(y,m-1,d); }
  return new Date();
}
const pad2=n=>String(n).padStart(2,'0');
function isoDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; } // local time, not UTC
function todayISO(){ return isoDate(today()); }
function currentMonth(){ return todayISO().slice(0,7); }
function inCurrentMonth(tx){ return typeof tx.date==='string' && tx.date.slice(0,7)===currentMonth(); }
function monthInfo(){
  const t=today(), day=t.getDate(), dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return {day,dim,daysLeft:dim-day+1,elapsedPct:Math.round(day/dim*100)};
}
/* ============ PAY CYCLE — Safe-to-Spend only has to last until the next salary ============ */
const DEFAULT_SETTINGS={payday:25,mainAccountId:null,budgets:{},paydaySet:false,setupSkip:[],setupDismissed:false};
let settings={...DEFAULT_SETTINGS}; // payday: day of month the salary arrives (clamped to short months)
/* Account where salary lands and pocket/card payments come from. Falls back to the first bank account. */
function mainAccountId(){ const m=accounts.find(a=>a.id===settings.mainAccountId&&a.type!=='credit'); if(m) return m.id; const b=accounts.find(a=>a.type==='bank')||accounts.find(a=>a.type!=='credit'); return b?b.id:null; }
function needMainAccount(){ if(mainAccountId()) return false; toast('Tambahkan rekening bank / e-wallet dulu di Pengaturan.'); goTab('settings'); return true; }
function paydayIn(y,m){ return new Date(y,m,Math.min(settings.payday,new Date(y,m+1,0).getDate())); }
function payCycle(){
  const t=today(), y=t.getFullYear(), m=t.getMonth(), t0=new Date(y,m,t.getDate());
  const thisMonth=paydayIn(y,m);
  const next= t0<thisMonth? thisMonth : paydayIn(y,m+1); // on payday itself the salary is in, so look to next month
  return {next,daysUntil:Math.round((next-t0)/86400000)}; // days from today (inclusive) to payday (exclusive)
}
/* The current pay cycle: from the last payday (inclusive) to the next payday (exclusive). */
let cycleCache=null;
function cycleBounds(){
  const key=todayISO()+'|'+settings.payday;
  if(!cycleCache||cycleCache.key!==key){ const {next}=payCycle(), prev=paydayIn(next.getFullYear(),next.getMonth()-1); cycleCache={key,start:isoDate(prev),end:isoDate(next),prev,next}; }
  return cycleCache;
}
function inCycle(tx){ const {start,end}=cycleBounds(); return typeof tx.date==='string'&&tx.date>=start&&tx.date<end; }
/* How a transaction changes spendable money. Savings pockets are separate money:
   putting money into a pocket sets it aside (−), spending from a pocket or moving money between
   your own accounts doesn't change what you can spend, and card purchases count when you buy. */
function spendableFlow(tx){
  if(tx.type==='income'||tx.type==='refund') return tx.amount;
  if(tx.type==='expense') return tx.pocketId? 0 : -tx.amount;
  if(tx.type==='transfer') return tx.pocketId? (tx.fromPocket? tx.amount : -tx.amount) : 0; // out of a pocket = spendable again
  return 0;
}
/* Due dates of a bill that fall inside the pay cycle [from, to). */
function billOccurrences(r,from,to){
  const out=[];
  for(let k=-1;k<=1;k++){
    const y=from.getFullYear(), m=from.getMonth()+k;
    const due=new Date(y,m,Math.min(r.dueDay,new Date(y,m+1,0).getDate()));
    if(due>=from&&due<to) out.push(due);
  }
  return out;
}
/* Is a bill's occurrence for `mon` (YYYY-MM) settled? Paid by a transaction for that month, skipped,
   or already inside the opening balance (due before the Saldo awal date). */
function billSettled(r,mon,due){
  const base=openingDate();
  if(base&&due&&isoDate(due)<base) return true;
  return transactions.some(t=>t.recurringId===r.id&&(t.forMonth||t.date.slice(0,7))===mon) || (r.skippedMonths||[]).includes(mon);
}
/* The month this cycle's occurrence of a bill belongs to: the first one not yet settled, else the first one. */
function billCycleMonth(r){
  const {prev,next}=cycleBounds(), occ=billOccurrences(r,prev,next);
  if(!occ.length) return currentMonth();
  const open=occ.find(d=>!billSettled(r,isoDate(d).slice(0,7),d));
  return isoDate(open||occ[0]).slice(0,7);
}
function billCycleDue(r){ const mon=billCycleMonth(r), [y,m]=mon.split('-').map(Number); return new Date(y,m-1,Math.min(r.dueDay,new Date(y,m,0).getDate())); }
/* Bills due inside this pay cycle that are not paid or skipped yet (expected amount). */
function billsDueUnpaid(){
  const {prev,next}=cycleBounds(); let total=0; const items=[];
  recurringItems.forEach(r=>{
    billOccurrences(r,prev,next).forEach(due=>{
      const mon=isoDate(due).slice(0,7);
      const settled=billSettled(r,mon,due) || ((r.status==='paid'||r.status==='skipped')&&(r.statusMonth||'')===mon);
      if(!settled){ total+=r.expectedAmount; items.push(r); }
    });
  });
  return {total,items};
}
function monthShort(){ return today().toLocaleDateString('id-ID',{month:'short'}).replace('.','').toUpperCase(); }
const SEED_MONTH='2026-10'; // month the sample bills' paid/upcoming statuses belong to
/* Bill statuses are per month: on a new month every bill becomes upcoming again. */
function rolloverBills(){
  recurringItems=recurringItems.map(r=>{
    const mon=billCycleMonth(r);
    if((r.statusMonth||SEED_MONTH)===mon) return r;
    const tx=transactions.find(t=>t.recurringId===r.id&&(t.forMonth||t.date.slice(0,7))===mon);
    if(tx) return {...r,status:'paid',actualAmount:tx.amount,txId:tx.id,accountId:tx.accountId,statusMonth:mon};
    return {...r,status:(r.skippedMonths||[]).includes(mon)?'skipped':'upcoming',actualAmount:null,txId:null,accountId:null,statusMonth:mon};
  });
}

function freshLogState(){ return {fromPocket:null,transferTo:'',billId:null,type:'expense',amount:'',date:todayISO(),categoryId:'cat_food',accountId:mainAccountId()||(accounts[0]?accounts[0].id:null),pocketId:pockets[0]?pockets[0].id:null,title:'',tag:'',essentialId:null,essentialQty:1}; }
let logState=freshLogState();

/* ============ PERSISTENCE & UNDO ============ */
let STORE_KEY=null; // 'flowpocket.v1.<userId>' once signed in
const SAFE_ID=/^[\w-]{1,64}$/;
function isValidState(s){
  if(!s||![s.accounts,s.pockets,s.recurringItems,s.transactions].every(Array.isArray)) return false;
  const num=v=>typeof v==='number'&&isFinite(v), str=v=>typeof v==='string', optStr=v=>v==null||str(v);
  const okId=v=>str(v)&&SAFE_ID.test(v), optId=v=>v==null||okId(v), optNum=v=>v==null||num(v);
  const optQty=v=>v==null||(Number.isInteger(v)&&v>0);
  if(s.settings!=null&&!(typeof s.settings==='object'&&Number.isInteger(s.settings.payday)&&s.settings.payday>=1&&s.settings.payday<=31)) return false;
  if(s.essentials!=null&&!(Array.isArray(s.essentials)&&s.essentials.every(e=>e&&okId(e.id)&&str(e.name)&&num(e.unitPrice)&&e.unitPrice>0&&Number.isInteger(e.targetQty)&&e.targetQty>0&&optId(e.categoryId)))) return false;
  if(s.settings&&s.settings.mainAccountId!=null&&!okId(s.settings.mainAccountId)) return false;
  if(s.settings&&s.settings.budgets!=null&&!(typeof s.settings.budgets==='object'&&!Array.isArray(s.settings.budgets)&&Object.entries(s.settings.budgets).every(([k,v])=>okId(k)&&num(v)&&v>=0))) return false;
  if(s.settings&&s.settings.setupSkip!=null&&!(Array.isArray(s.settings.setupSkip)&&s.settings.setupSkip.every(okId))) return false;
  const okMoves=m=>m==null||(Array.isArray(m)&&m.every(x=>x&&okId(x.id)&&num(x.amount)));
  return s.accounts.every(a=>okId(a.id)&&str(a.name)&&str(a.type)&&num(a.balance)&&okId(a.icon)&&/^#[0-9a-f]{3,8}$/i.test(a.color))
    && s.pockets.every(p=>okId(p.id)&&str(p.name)&&optStr(p.description)&&optStr(p.targetDate)&&okId(p.icon)&&num(p.currentAmount)&&p.currentAmount>=0&&num(p.targetAmount)&&p.targetAmount>0&&num(p.monthlyHint))
    && s.recurringItems.every(r=>okId(r.id)&&str(r.name)&&optStr(r.note)&&optStr(r.statusMonth)&&['paid','upcoming','skipped'].includes(r.status)&&optId(r.categoryId)&&optId(r.txId)&&optId(r.accountId)&&num(r.dueDay)&&num(r.expectedAmount)&&optNum(r.actualAmount)&&(r.skippedMonths==null||(Array.isArray(r.skippedMonths)&&r.skippedMonths.every(m=>str(m)&&/^\d{4}-\d{2}$/.test(m)))))
    && s.transactions.every(t=>okId(t.id)&&str(t.title)&&optStr(t.tag)&&str(t.date)&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&['expense','income','transfer','refund'].includes(t.type)&&num(t.amount)&&optId(t.accountId)&&optId(t.categoryId)&&optId(t.pocketId)&&optId(t.essentialId)&&optId(t.recurringId)&&optId(t.toAccountId)&&okMoves(t.moves)&&optQty(t.essentialQty)
      && (t.creditPayoff==null||(Array.isArray(t.creditPayoff)&&t.creditPayoff.every(c=>c&&okId(c.id)&&num(c.amount)))));
}
function applyState(s){ accounts=s.accounts; pockets=s.pockets; recurringItems=s.recurringItems; transactions=s.transactions; if(Array.isArray(s.essentials)) essentials=s.essentials; settings={...DEFAULT_SETTINGS,...(s.settings||{})}; if(s.settings&&s.settings.paydaySet==null&&(s.settings.payday!==25||s.transactions.length)) settings.paydaySet=true; }
function snapshot(){ return JSON.parse(JSON.stringify({accounts,pockets,recurringItems,transactions,essentials,settings})); }
let saveWarned=false;
function saveState(){ if(!STORE_KEY) return; scheduleCloudPush(); writeMeta(); try{ localStorage.setItem(STORE_KEY,JSON.stringify({v:1,accounts,pockets,recurringItems,transactions,essentials,settings})); }catch(e){ if(!saveWarned){ saveWarned=true; setTimeout(()=>toast('Browser ini tidak bisa menyimpan data — ekspor cadangan secara berkala.'),0); } } }

/* ============ CLOUD: Supabase login + sync (one row of JSON per owner) ============ */
// Meta = which cloud version the cache is based on, and whether it has unsynced edits (survives reloads/offline).
function writeMeta(){ if(!STORE_KEY) return; try{ localStorage.setItem(STORE_KEY+'.meta',JSON.stringify({base:cloudUpdatedAt,dirty:stateJSON()!==lastPushed})); }catch(e){} }
function readMeta(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY+'.meta'))||{}; }catch(e){ return {}; } }
// The publishable key is meant to be public; row-level security keeps the data private to its owner.
const SB_URL='https://jmzirikqbslkamferwfd.supabase.co';
const SB_KEY='sb_publishable_hX9TfthdPvqglk27txy4Sw_v0krEGSW';
let sb=null, cloudUser=null, cloudRowExists=false, cloudUpdatedAt=null, lastPushed=null, pushTimer=null, pushing=false, syncStatus='', initialPullDone=false;
function stateJSON(){ return JSON.stringify({v:1,accounts,pockets,recurringItems,transactions,essentials,settings}); }
function setSync(status){
  syncStatus=status; const el=document.getElementById('syncStatus'); if(!el) return;
  const map={saving:['Menyimpan…','var(--muted)'],saved:['Tersimpan ✓','var(--emerald)'],offline:['Offline — disimpan di perangkat','var(--amber-text)'],error:['Gagal sinkron','var(--rose)']};

/* Called from saveState(): push the change to the cloud shortly after the last edit. */
function scheduleCloudPush(){
  if(!cloudUser||!initialPullDone) return;
  if(stateJSON()===lastPushed) return;
  setSync('saving'); clearTimeout(pushTimer); pushTimer=setTimeout(cloudPush,1200);
}
async function cloudPush(){
  if(!cloudUser||pushing) return;
  const json=stateJSON(); if(json===lastPushed){ setSync('saved'); return; }
  if(!navigator.onLine){ setSync('offline'); return; }
  pushing=true;
  try{
    const data=JSON.parse(json);
    if(!cloudRowExists){
      const {data:row,error}=await sb.from('app_state').insert({user_id:cloudUser.id,data}).select('updated_at').single();
      if(error) throw error;
      cloudRowExists=true; cloudUpdatedAt=row.updated_at;
    } else {
      // Only overwrite the version we last saw, so a newer save from another device is never lost.
      const {data:rows,error}=await sb.from('app_state').update({data}).eq('user_id',cloudUser.id).eq('updated_at',cloudUpdatedAt).select('updated_at');
      if(error) throw error;
      if(!rows.length){ pushing=false; await cloudPull(true); return; }
      cloudUpdatedAt=rows[0].updated_at;
    }
    lastPushed=json; setSync('saved'); writeMeta();
  }catch(e){
    if(e&&/row-level security/i.test(e.message||'')){ setSync('error'); toast('Akun ini bukan pemilik data FlowPocket — data tidak disimpan ke cloud.'); }
    else setSync(navigator.onLine?'error':'offline');
  }finally{ pushing=false; }
  if(stateJSON()!==lastPushed&&syncStatus==='saved') scheduleCloudPush();
}
/* Fetch the cloud copy. `conflict` = our save was rejected because another device saved first. */
async function cloudPull(conflict){
  const {data:row,error}=await sb.from('app_state').select('data,updated_at').eq('user_id',cloudUser.id).maybeSingle();
  if(error){ setSync(navigator.onLine?'error':'offline'); return false; }
  if(!row){ cloudRowExists=false; return false; }
  cloudRowExists=true;
  if(row.updated_at===cloudUpdatedAt&&!conflict) return true;
  if(!isValidState(row.data)){ setSync('error'); toast('Data di cloud tidak valid — tidak dimuat.'); return false; }
  const hadUnsynced= lastPushed!==stateJSON();
  toastUndoFn=null; // an undo snapshot from before this pull would overwrite newer data
  cloudUpdatedAt=row.updated_at; applyState(row.data); lastPushed=stateJSON();
  render(); setSync('saved'); writeMeta();
  if(!conflict&&hadUnsynced) toast('Data di cloud lebih baru dari perangkat ini — perubahan offline di sini tidak disimpan.');
  if(conflict) toast('Data diperbarui dari perangkat lain. Perubahan terakhir di sini mungkin perlu diulang.');
  return true;
}
async function onSignedIn(user){
  cloudUser=user; STORE_KEY='flowpocket.v1.'+user.id;

  document.getElementById('acctInitial').textContent=((user.email||'?').trim()[0]||'?').toUpperCase();
  document.querySelector('#acctMenu .acct-btn').title=user.email||'';
  loadState(); // cached copy first, so the app opens instantly / offline
  const meta=readMeta();
  cloudUpdatedAt=meta.base||null; cloudRowExists=!!meta.base; lastPushed= meta.dirty? null : stateJSON();
  render();
  setSync('saving');
  const found=await cloudPull(false);
  initialPullDone=true;
  if(found){ if(stateJSON()!==lastPushed) scheduleCloudPush(); else setSync('saved'); } // unsynced offline edits on top of the latest cloud copy
  if(!found){

    lastPushed=null; scheduleCloudPush();
  }
}

function adjBalance(accId,delta){ accounts=accounts.map(a=> a.id===accId? {...a,balance:a.balance+delta}:a); }
/* Exact inverse of every way a transaction is created. Also frees a bill it paid. */
function reverseTx(tx){
  if(tx.type==='expense'){ adjBalance(tx.accountId,tx.amount); if(tx.pocketId) pockets=pockets.map(p=> p.id===tx.pocketId? {...p,currentAmount:p.currentAmount+tx.amount}:p); }
  else if(tx.type==='income'||tx.type==='refund'){ if(!tx.opening) adjBalance(tx.accountId,-tx.amount); }
  else if(tx.type==='transfer'){
    if(tx.pocketId) pockets=pockets.map(p=> p.id===tx.pocketId? {...p,currentAmount: tx.fromPocket? p.currentAmount+tx.amount : Math.max(0,p.currentAmount-tx.amount)}:p);
    if(Array.isArray(tx.creditPayoff)){ adjBalance(tx.accountId,tx.amount); tx.creditPayoff.forEach(c=>adjBalance(c.id,-c.amount)); }
    if(Array.isArray(tx.moves)) tx.moves.forEach(m=>adjBalance(m.id,-m.amount));
  }
  if(tx.recurringId) recurringItems=recurringItems.map(r=> r.id===tx.recurringId&&r.txId===tx.id? {...r,status:'upcoming',actualAmount:null,txId:null,accountId:null}:r);
}

function fmt(n,sign){ if(n===null||n===undefined) return '—'; const neg=n<0; const s='Rp '+Math.round(Math.abs(n)).toLocaleString('id-ID'); if(sign){ if(n>0) return '+'+s; if(neg) return '-'+s; } return neg?'-'+s:s; }

function essentialsSummary(){
  const items=essentials.map(item=>{
    const totalPlanned=item.unitPrice*item.targetQty;
    // Only purchases the user explicitly linked count — no guessing from titles.
    const mtx=transactions.filter(tx=> tx.type==='expense' && tx.essentialId===item.id && inCycle(tx));
    const spent=mtx.reduce((s,t)=>s+t.amount,0);
    const bought=mtx.reduce((s,t)=> s+(t.essentialQty? t.essentialQty : Math.max(1,Math.round(t.amount/item.unitPrice))),0);
    const remQty=Math.max(0,item.targetQty-bought);
    const isComplete=remQty===0||spent>=totalPlanned; // all units bought, or the planned money is used up
    return {...item,totalPlanned,spentAmount:spent,boughtQty:bought,remainingAmount:isComplete?0:item.unitPrice*remQty,remainingQty:remQty,isComplete};
  });
  return {items,totalEssentialsBudget:items.reduce((s,i)=>s+i.totalPlanned,0),totalEssentialsSpent:items.reduce((s,i)=>s+i.spentAmount,0),totalEssentialsRemaining:items.reduce((s,i)=>s+i.remainingAmount,0),completedCount:items.filter(i=>i.isComplete).length};
}
function budgetOf(catId){ const v=(settings.budgets||{})[catId]; return typeof v==='number'&&v>0? v : 0; }
function financialSummary(){
  const totalLiquidCash=accounts.filter(a=>a.type!=='credit').reduce((s,a)=>s+a.balance,0);
  const creditFloatHolding=accounts.filter(a=>a.type==='credit').reduce((s,a)=>s+Math.abs(Math.min(0,a.balance)),0);
  const totalPocketsSaved=pockets.reduce((s,p)=>s+p.currentAmount,0);
  const unpaidExpectedRecurring=recurringItems.filter(r=>r.status==='upcoming').reduce((s,r)=>s+r.expectedAmount,0);
  const paid=recurringItems.filter(r=>r.status==='paid');
  const recurringNetVariance=paid.reduce((s,r)=>s+r.expectedAmount,0)-paid.reduce((s,r)=>s+(r.actualAmount||0),0);
  // Safe-to-Spend = leftover from earlier cycles + income this cycle − spending − money put into savings
  //                 − bills still to pay this cycle − Essentials still to buy (expected price).
  const ess=essentialsSummary(), essentialsRemaining=ess.totalEssentialsRemaining;
  const cyc=cycleBounds();
  let carryOver=0, cycleIncome=0, cycleSpending=0, cycleSaved=0;
  const baseline=openingDate();
  transactions.forEach(tx=>{
    if(baseline&&tx.date<baseline) return; // already included in the opening balance
    const f=spendableFlow(tx); if(!f) return;
    if(tx.date<cyc.start){ carryOver+=f; return; }
    if(tx.date>=cyc.end) return;
    if(tx.type==='income'||tx.type==='refund') cycleIncome+=f;
    else if(tx.type==='transfer') cycleSaved+=-f;
    else cycleSpending+=-f;
  });
  const bills=billsDueUnpaid(), billsReserved=bills.total, essentialsReserved=essentialsRemaining;
  const safeToSpend=carryOver+cycleIncome-cycleSpending-cycleSaved-billsReserved-essentialsReserved;
  const {elapsedPct:monthElapsedPercent}=monthInfo();
  const {next:nextPayday,daysUntil:daysToPayday}=payCycle();
  const perDay= safeToSpend>0? Math.floor(safeToSpend/daysToPayday) : 0;
  // Budgets cover free spending only: bills and Essentials are planned (and reserved) separately.
  const totalFlexibleBudget=categories.filter(c=>c.type==='expense').reduce((s,c)=>s+budgetOf(c.id),0);
  const map={}, planned={}; categories.forEach(c=>{ map[c.id]=0; planned[c.id]=0; });
  let monthlyIncome=0, monthlyNetExpense=0;
  transactions.filter(inCurrentMonth).forEach(tx=>{
    if(tx.type==='expense'&&!tx.pocketId&&(tx.recurringId||tx.essentialId)){ if(planned[tx.categoryId]!==undefined) planned[tx.categoryId]+=tx.amount; }
    else if(tx.type==='expense'&&!tx.pocketId){ monthlyNetExpense+=tx.amount; if(map[tx.categoryId]!==undefined) map[tx.categoryId]+=tx.amount; }
    else if(tx.type==='refund'){ if(map[tx.categoryId]!==undefined) map[tx.categoryId]=Math.max(0,map[tx.categoryId]-tx.amount); }
    else if(tx.type==='income'&&!tx.opening){ monthlyIncome+=tx.amount; }
  });
  monthlyNetExpense=Object.values(map).reduce((a,b)=>a+b,0); // free spending after refunds, never negative
  const budgetedSpend=categories.filter(c=>budgetOf(c.id)>0).reduce((s,c)=>s+(map[c.id]||0),0);
  const budgetSpentPercent= totalFlexibleBudget>0? Math.round(budgetedSpend/totalFlexibleBudget*100):0;
  return {carryOver,cycleIncome,cycleSpending,cycleSaved,cycleStart:cyc.prev,totalLiquidCash,creditFloatHolding,totalPocketsSaved,unpaidExpectedRecurring,essentialsRemaining,billsReserved,essentialsReserved,nextPayday,daysToPayday,perDay,recurringNetVariance,safeToSpend,totalFlexibleBudget,monthlyNetExpense,monthlyIncome,monthElapsedPercent,budgetSpentPercent,budgetedSpend,categorySpendMap:map,plannedSpendMap:planned};
}

/* Opening balance: tells Safe-to-Spend how much spendable money you already had when you started.
   Recorded as income for the calculation only; account balances stay as you entered them. */
function openingTx(){ return transactions.filter(t=>t.opening).sort((a,b)=>b.date.localeCompare(a.date))[0]||null; }
function openingDate(){ const o=openingTx(); return o? o.date : null; }
/* Suggested opening balance for a date: money in accounts now, minus card debt, minus the effect of
   everything already logged on/after that date (those entries will be counted separately). */
/* How an entry changed (bank + e-wallet − card debt). Old pocket top-ups without `moves` changed nothing. */
function balanceDelta(tx){
  if(tx.type==='income'||tx.type==='refund') return tx.opening? 0 : tx.amount;
  if(tx.type==='expense') return tx.accountId? -tx.amount : 0;
  if(tx.type==='transfer') return (tx.moves||[]).reduce((s,m)=>s+m.amount,0) + (Array.isArray(tx.creditPayoff)? -tx.amount+tx.creditPayoff.reduce((s,c)=>s+c.amount,0) : 0);
  return 0;
}
function openingSuggestion(date){
  const cash=accounts.filter(a=>a.type!=='credit').reduce((s,a)=>s+a.balance,0), owed=accounts.filter(a=>a.type==='credit').reduce((s,a)=>s+Math.max(0,-a.balance),0);
  const later=transactions.filter(t=>!t.opening&&t.date>=date).reduce((s,t)=>s+balanceDelta(t),0);
  return {cash,owed,later,value:Math.max(0,cash-owed-later)};
}
function refreshOpeningSuggestion(){ const d=document.getElementById('obDate').value||todayISO(), sg=openingSuggestion(d); document.getElementById('obAmt').value=sg.value?sg.value.toLocaleString('id-ID'):''; document.getElementById('obHint').innerHTML=openingHint(sg); }
function openingHint(sg){ return `Saran: saldo rekening ${fmt(sg.cash)} − kartu kredit ${fmt(sg.owed)}${sg.later?` − ${fmt(sg.later)} yang sudah tercatat sejak tanggal ini`:''} = <b>${fmt(sg.value)}</b>`; }
function openOpeningBalance(){
  if(!accounts.length){ toast('Tambahkan rekening dulu di Pengaturan.'); goTab('settings'); return; }
  const sg=openingSuggestion(todayISO()), suggest=sg.value;
  modalShell('Saldo Awal', `<p class="rc-help" style="margin:0 0 12px">Berapa uang yang bisa kamu belanjakan saat mulai memakai FlowPocket? Biasanya: saldo semua rekening & e-wallet dikurangi tagihan kartu kredit — <b>tanpa</b> tabungan di Saving Pockets. Saldo rekening tidak berubah; angka ini hanya titik awal Safe-to-Spend.</p>
    <div class="field"><label for="obAmt">Saldo awal (Rp)</label>${amtInput('obAmt',suggest).replace('<input','<input class="big"')}<div class="rc-help" id="obHint">${openingHint(sg)}</div></div>
    <div class="field"><label for="obDate">Per tanggal</label><input id="obDate" type="date" value="${todayISO()}" max="${todayISO()}" onchange="refreshOpeningSuggestion()"></div>
    ${openingTx()?`<p class="rc-help" style="margin:0">Saldo awal sebelumnya (${esc(openingTx().date)}) akan diganti dengan yang baru.</p>`:''}`,
    `<button class="btn btn-emerald" style="width:100%;padding:12px" onclick="saveOpeningBalance()">Simpan saldo awal</button>`);
}
function saveOpeningBalance(){
  const amt=amtVal('obAmt'), raw=document.getElementById('obDate').value, date=/^\d{4}-\d{2}-\d{2}$/.test(raw)?raw:todayISO();
  if(amt<=0){ toast('Masukkan saldo awal lebih dari nol.'); return; }
  if(date>todayISO()){ toast('Tanggal tidak boleh di masa depan.'); return; }
  const snap=snapshot();
  transactions=transactions.filter(t=>!t.opening); // one starting point only
  transactions=[{id:'tx_open_'+Date.now(),date,title:'Saldo awal',amount:amt,type:'income',categoryId:'cat_opening',accountId:mainAccountId()||accounts[0].id,tag:'#saldo-awal',pocketId:null,opening:true},...transactions].sort((a,b)=>b.date.localeCompare(a.date));
  closeModal(); render(); toastUndo(`Saldo awal ${fmt(amt)} dicatat.`,snap);
}

}

function groupedTx(){
  const filtered=transactions.filter(tx=>{
    const q=tx.title.toLowerCase().includes(searchQuery.toLowerCase())||(tx.tag&&tx.tag.toLowerCase().includes(searchQuery.toLowerCase()));
    const t=filterType==='all'||tx.type===filterType;
    const c=filterCategory==='all'||tx.categoryId===filterCategory;
    return q&&t&&c;
  });
  const groups={};
  filtered.forEach(tx=>{ if(!groups[tx.date]) groups[tx.date]={date:tx.date,items:[],net:0}; groups[tx.date].items.push(tx); if(tx.type==='expense'&&!tx.pocketId) groups[tx.date].net-=tx.amount; if(tx.type==='refund'||tx.type==='income') groups[tx.date].net+=tx.amount; });
  return Object.values(groups).sort((a,b)=>b.date.localeCompare(a.date));
}

iv>`).join('')}</div>

function openLoggerWithEssential(id){
  const item=essentialsSummary().items.find(e=>e.id===id); if(!item) return;
  logState={...freshLogState(),amount:String(item.unitPrice),categoryId:item.categoryId,title:item.name,essentialId:item.id};
  openLogger();
}
function selectEssentialInLogger(id,qty,keepInput){
  const item=essentials.find(e=>e.id===id); if(!item) return;
  const q=Math.max(1,qty);
  logState.essentialId=id; logState.essentialQty=q;
  if(keepInput){
    // Confirming a suggestion: keep what the user already typed or picked.
    if(!parseAmt(logState.amount)) logState.amount=String(Math.round(item.unitPrice*q));
    if(!logState.categoryTouched) logState.categoryId=item.categoryId;
  } else {
    logState.categoryId=item.categoryId; logState.amount=String(Math.round(item.unitPrice*q)); logState.title= q>1? `${item.name} (${q}x)` : item.name;
  }
  openLogger();
}
function unlinkEssential(){ logState.essentialId=null; logState.essentialQty=1; updateLoggerPreview(); }
/* Linked-essential panel or a confirm-to-link suggestion. Rebuilt in place so typing never loses focus. */
function linkBillInLogger(id){
  const r=recurringItems.find(x=>x.id===id); if(!r) return;
  logState.billId=id; logState.essentialId=null; logState.categoryId=r.categoryId;
  if(!parseAmt(logState.amount)) logState.amount=String(Math.round(r.expectedAmount));
  if(!logState.title.trim()) logState.title=r.name;
  openLogger();
}
function unlinkBill(){ logState.billId=null; updateLoggerPreview(); }
function loggerPreviewHTML(){
  if(logState.type==='expense'&&logState.billId){
    const r=recurringItems.find(x=>x.id===logState.billId);
    if(r) return `<div class="ess-suggest" style="border-style:solid;border-color:var(--emerald-border);background:var(--emerald-bg)"><span style="color:var(--emerald-text)">✓ Dicatat sebagai pembayaran tagihan <strong>${esc(r.name)}</strong> (perkiraan ${fmt(r.expectedAmount)})</span><button class="link-btn" style="font-size:11px" onclick="unlinkBill()">Lepas tautan</button></div>`;
  }
  if(logState.type==='expense'&&!logState.essentialId){
    // A name match wins; an amount-only match must not hide an Essentials suggestion.
    const b=billByName(logState.title) || (essentialSuggestion()? null : billByAmount(parseAmt(logState.amount)));
    if(b) return `<div class="ess-suggest"><span>Ini pembayaran tagihan <strong>${esc(b.name)}</strong> (tgl ${b.dueDay})?</span><button class="btn btn-sm" onclick="linkBillInLogger('${b.id}')">Ya, tandai lunas</button></div>`;
  }
  const m=matchedEssential();
  if(m){
    const cur=parseAmt(logState.amount), iq=logState.essentialQty;
    const afterAmt=Math.max(0,m.remainingAmount-cur), afterQty=Math.max(0,m.remainingQty-iq);
    const afterTotal=Math.max(0,essentialsSummary().totalEssentialsRemaining-Math.min(m.remainingAmount,cur));
    return `<div style="background:var(--emerald-bg);border:1px solid var(--emerald-border);border-radius:14px;padding:12px;margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><strong style="font-size:12px;color:var(--emerald-text)">✓ Ditautkan ke Essentials: ${esc(m.name)} (${fmt(m.unitPrice)} × ${m.targetQty})</strong><span style="display:flex;gap:6px;align-items:center">${m.targetQty>1?`<span style="display:flex;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--emerald-border);border-radius:8px;padding:2px 6px"><button class="icon-btn" aria-label="Kurangi jumlah" onclick="selectEssentialInLogger('${m.id}',${Math.max(1,iq-1)})">−</button><strong style="font-size:11px">${iq}x</strong><button class="icon-btn" aria-label="Tambah jumlah" onclick="selectEssentialInLogger('${m.id}',${iq+1})">+</button></span>`:''}<button class="link-btn" style="font-size:11px" onclick="unlinkEssential()">Lepas tautan</button></span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;margin-top:8px;padding-top:8px;border-top:1px solid var(--emerald-border)"><div><span style="color:var(--emerald)">Sisa item setelah ini:</span><br><strong>${afterQty} qty (${fmt(afterAmt)})</strong></div><div style="text-align:right"><span style="color:var(--emerald)">Total sisa Essentials:</span><br><strong>${fmt(afterTotal)}</strong></div></div></div>`;
  }
  const s=essentialSuggestion();
  if(s) return `<div class="ess-suggest"><span>Ini pembelian Essentials <strong>${esc(s.name)}</strong>?</span><button class="btn btn-sm" onclick="selectEssentialInLogger('${s.id}',1,true)">Ya, tautkan</button></div>`;
  return '';
}
function updateLoggerPreview(){
  const amt=parseAmt(logState.amount);
  const hint=document.getElementById('qlAmtHint'), box=document.getElementById('qlMatch'), save=document.getElementById('qlSave');
  if(hint) hint.textContent='= '+fmt(amt);
  if(box) box.innerHTML=loggerPreviewHTML();
  if(save) save.textContent='Simpan • '+fmt(amt);
}
function openLogger(){
  if(!accounts.length){ toast('Tambahkan rekening dulu di Pengaturan.'); goTab('settings'); return; }
  const body=`
    <div class="type-grid" style="margin-bottom:12px">${[['expense','Expense'],['income','Income'],['transfer','Transfer']].map(([id,l])=>`<button class="${logState.type===id?'active':''}" onclick="setLogType('${id}')">${l}</button>`).join('')}</div>
    ${logState.type==='expense'?`<div class="ql-imports"><button class="btn" onclick="openReceipt()"><i data-lucide="receipt"></i>Scan struk</button><button class="btn" onclick="openStatement()"><i data-lucide="file-text"></i>Impor tagihan kartu</button></div>`:''}
    <div class="field"><label for="qlAmt">Nominal (Rp)</label><input id="qlAmt" class="big" type="text" inputmode="numeric" autocomplete="off" value="${parseAmt(logState.amount)?parseAmt(logState.amount).toLocaleString('id-ID'):''}" oninput="fmtAmtInput(this);logState.amount=this.value;updateLoggerPreview()" onpaste="pasteAmt(event,this)" placeholder="0"><div id="qlAmtHint" style="font-size:11px;color:var(--muted);margin-top:4px">= ${fmt(parseAmt(logState.amount))}</div></div>

    <div class="field"><label for="qlTitle">Judul / Catatan</label><input id="qlTitle" type="text" value="${esc(logState.title)}" oninput="logState.title=this.value;updateLoggerPreview()" placeholder="${logState.type==='transfer'?'Opsional — cth. Top up GoPay':'cth. Kopi pagi, Ayam 2x, Gaji…'}"></div>
    <div class="field"><label for="qlDate">Tanggal</label><input id="qlDate" type="date" value="${esc(logState.date)}" max="${todayISO()}" oninput="logState.date=this.value"></div>
    ${logState.type==='transfer'?transferFieldsHTML():`<div class="field"><label for="qlCat">Kategori</label><select id="qlCat" onchange="logState.categoryId=this.value;logState.categoryTouched=true">${categories.filter(c=> logState.type==='income'? c.type==='income'&&c.id!=='cat_opening' : c.type==='expense').map(c=>`<option value="${c.id}" ${logState.categoryId===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
    <div class="field"><label for="qlAcc">Rekening</label><select id="qlAcc" onchange="logState.accountId=this.value">${accounts.map(a=>`<option value="${a.id}" ${logState.accountId===a.id?'selected':''}>${esc(a.name)} — ${fmt(a.balance)}</option>`).join('')}</select></div>`}
    ${logState.type==='transfer'?'':`<div class="field"><label for="qlTag">Tag (opsional)</label><input id="qlTag" type="text" value="${esc(logState.tag)}" oninput="logState.tag=this.value" placeholder="#weekend, #essential…"></div>`}
    <p style="font-size:11px;color:var(--muted);line-height:1.5;margin:0">Saldo, pocket, tagihan, dan progres Essentials langsung diperbarui begitu disimpan, lalu tersinkron ke akunmu.</p>
  `;
  modalShell('Quick Log — catat dalam 10 detik', body, `<button id="qlSave" class="btn btn-emerald" style="width:100%;padding:13px;font-size:14px" onclick="saveQuickLog()">Simpan • ${fmt(parseAmt(logState.amount))}</button>`);
  const amtEl=document.getElementById('qlAmt'); if(amtEl&&!logState.amount) amtEl.focus();
}
function setLogType(t){ logState.type=t; if(t==='transfer'&&!logState.transferTo) logState.transferTo=defaultTransferTo(); if(t==='income') logState.categoryId='cat_salary'; if(t==='expense'||t==='refund') { if(!categories.find(c=>c.id===logState.categoryId&&c.type==='expense')) logState.categoryId='cat_coffee'; } openLogger(true); }
function saveQuickLog(){
  const amt=parseAmt(logState.amount);
  if(amt<=0){ toast('Masukkan nominal lebih dari nol dulu ya.'); return; }
  if(logState.type==='transfer'){ saveTransfer(amt); return; }
  const cat=catById(logState.categoryId), pock=pockById(logState.pocketId), m=matchedEssential();
  const defTitle= logState.type==='transfer'? `Transfer ke ${pock?pock.name:'Pocket'}` : logState.type==='refund'? `Reimbursement (${cat?cat.name:'General'})` : m? m.name : (cat?cat.name:'Quick Entry');
  const qlDate= /^\d{4}-\d{2}-\d{2}$/.test(logState.date||'')? logState.date : todayISO();
  if(qlDate>todayISO()){ toast('Tanggal tidak boleh di masa depan.'); return; }
  const snap=snapshot();
  const bill= logState.type==='expense'&&logState.billId? recurringItems.find(r=>r.id===logState.billId) : null;
  if(bill){
    const title=logState.title.trim()||bill.name, accId=logState.accountId;
    const thisMonth=recordBillPayment(bill,amt,accId,qlDate,{title,categoryId:logState.categoryId,tag:logState.tag.trim()||'#recurring'});
    closeModal(); logState=freshLogState(); render();
    toastUndo(thisMonth? `"${bill.name}" ditandai lunas: ${fmt(amt)}` : `Pembayaran "${bill.name}" dicatat untuk bulan lalu.`, snap);
    return;
  }
  const newTx={id:'tx_'+Date.now(),date:qlDate,title:logState.title.trim()||defTitle,amount:amt,type:logState.type,categoryId: logState.type==='transfer'?null:logState.categoryId,accountId:logState.accountId,tag: logState.tag.trim()||(logState.type==='refund'?'#reimbursement': m?'#essential':'#quick-log'),pocketId: logState.type==='transfer'?logState.pocketId:null,essentialId: m?m.id:null,essentialQty: m?logState.essentialQty:null};
  accounts=accounts.map(a=>{ if(a.id!==logState.accountId) return a; if(logState.type==='expense') return {...a,balance:a.balance-amt}; if(logState.type==='income'||logState.type==='refund') return {...a,balance:a.balance+amt}; return a; });
  if(logState.type==='transfer'&&logState.pocketId) pockets=pockets.map(p=> p.id===logState.pocketId? {...p,currentAmount:p.currentAmount+amt}:p);
  transactions=[newTx,...transactions];
  closeModal();
  logState=freshLogState();
  render();
  toastUndo(m? `Tercatat: ${m.name}! Sisa item dan total Essentials sudah diperbarui.` : `Tersimpan: ${newTx.title} (${fmt(amt)})`, snap);
}

/* ===== TRANSFER: between own accounts, or into a saving pocket ===== */
// Saving pockets are separate money: saving moves money out of an account into the pocket,
// taking it out moves it back into an account.
function defaultTransferTo(){ if(logState.fromPocket){ const m=accounts.find(a=>a.type!=='credit'); return m? 'acc:'+m.id : ''; } const other=accounts.find(a=>a.id!==logState.accountId); return other? 'acc:'+other.id : (pockets[0]? 'pock:'+pockets[0].id : ''); }
function setTransferFrom(v){ if(v.startsWith('pock:')){ logState.fromPocket=v.slice(5); const t=logState.transferTo||''; if(t.startsWith('pock:')||(t.startsWith('acc:')&&(accById(t.slice(4))||{}).type==='credit')) logState.transferTo=''; } else { logState.fromPocket=null; logState.accountId=v; if(logState.transferTo==='acc:'+v) logState.transferTo=''; } if(!logState.transferTo) logState.transferTo=defaultTransferTo(); openLogger(); }
function transferFieldsHTML(){
  const fromPock=logState.fromPocket? pockById(logState.fromPocket) : null, from=fromPock? 'pock:'+fromPock.id : logState.accountId, to=logState.transferTo||'';
  const fromOpts=accounts.map(a=>`<option value="${a.id}" ${from===a.id?'selected':''}>${esc(a.name)} — ${fmt(a.balance)}</option>`).join('')
    + (pockets.length? `<optgroup label="Saving Pockets (ambil tabungan)">${pockets.map(p=>`<option value="pock:${p.id}" ${from==='pock:'+p.id?'selected':''}>${esc(p.name)} — ${fmt(p.currentAmount)}</option>`).join('')}</optgroup>` : '');
  const accOpts=accounts.filter(a=>a.id!==from&&!(fromPock&&a.type==='credit')).map(a=>`<option value="acc:${a.id}" ${to==='acc:'+a.id?'selected':''}>${esc(a.name)}${a.type==='credit'?' (bayar kartu)':''}</option>`).join('');
  const pockOpts=fromPock? '' : pockets.map(p=>`<option value="pock:${p.id}" ${to==='pock:'+p.id?'selected':''}>${esc(p.name)} — ${fmt(p.currentAmount)}</option>`).join('');
  const note= fromPock? 'Mengambil dari tabungan: saldo pocket berkurang, rekening bertambah, dan Safe-to-Spend naik.'
    : to.startsWith('pock:')? 'Menabung: saldo rekening berkurang, pocket bertambah, dan Safe-to-Spend turun.'
    : to.startsWith('acc:')&&(accById(to.slice(4))||{}).type==='credit'? 'Membayar tagihan kartu kredit — hutang kartu berkurang.' : 'Uang pindah antar rekening sendiri — tidak dihitung sebagai pengeluaran.';
  return `<div class="field"><label for="qlFrom">Dari</label><select id="qlFrom" onchange="setTransferFrom(this.value)">${fromOpts}</select></div>
  <div class="field"><label for="qlTo">Ke</label><select id="qlTo" onchange="logState.transferTo=this.value;openLogger()"><option value="" ${to?'':'selected'}>Pilih tujuan…</option>${accOpts?`<optgroup label="Rekening & kartu">${accOpts}</optgroup>`:''}${pockOpts?`<optgroup label="Saving Pockets">${pockOpts}</optgroup>`:''}</select>
  <p class="rc-help" style="margin:6px 0 0">${note}</p></div>`;
}
function saveTransfer(amt){
  const fromPock=logState.fromPocket? pockById(logState.fromPocket) : null;
  const from= fromPock? null : accById(logState.accountId), [kind,id]=(logState.transferTo||'').split(':');
  const toAcc= kind==='acc'? accById(id) : null, pock= kind==='pock'&&!fromPock? pockById(id) : null;
  if((!from&&!fromPock)||(!toAcc&&!pock)){ toast('Pilih asal dan tujuan transfer.'); return; }
  if(toAcc&&from&&toAcc.id===from.id){ toast('Rekening asal dan tujuan tidak boleh sama.'); return; }
  if(fromPock&&toAcc&&toAcc.type==='credit'){ toast('Dari pocket hanya bisa ke rekening bank / e-wallet.'); return; }
  if(fromPock&&amt>fromPock.currentAmount){ toast(`Saldo ${fromPock.name} hanya ${fmt(fromPock.currentAmount)}.`); return; }
  const date= /^\d{4}-\d{2}-\d{2}$/.test(logState.date||'')? logState.date : todayISO();
  if(date>todayISO()){ toast('Tanggal tidak boleh di masa depan.'); return; }
  const snap=snapshot();
  // Pockets are separate savings: money really leaves (or arrives in) the account.
  const moves= fromPock? [{id:toAcc.id,amount:amt}] : toAcc? [{id:from.id,amount:-amt},{id:toAcc.id,amount:amt}] : [{id:from.id,amount:-amt}];
  moves.forEach(m=>adjBalance(m.id,m.amount));
  if(pock) pockets=pockets.map(p=> p.id===pock.id? {...p,currentAmount:p.currentAmount+amt}:p);
  if(fromPock) pockets=pockets.map(p=> p.id===fromPock.id? {...p,currentAmount:p.currentAmount-amt}:p);
  const title=logState.title.trim()||(fromPock? `Ambil dari ${fromPock.name}` : toAcc? (toAcc.type==='credit'?`Bayar ${toAcc.name}`:`Transfer ke ${toAcc.name}`) : `Tabung ke ${pock.name}`);

  transactions=[tx,...transactions].sort((a,b)=>b.date.localeCompare(a.date));
  closeModal(); logState=freshLogState(); render();

/* ===== RECEIPTS: paste text or photo (on-device OCR) → review list → one transaction per item ===== */
const RC_DATE=/\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}|\b\d{1,2}:\d{2}\b/;
const RC_SKIP=/(sub\s*total|harga\s*jual|grand|netto|tunai|cash|kembali|change|ppn|pajak|tax|dpp|bayar|debit|kredit|credit|kartu|card|qris|ovo|gopay|shopeepay|npwp|telp|kasir|struk|terima\s*kasih|member|poin|point|saldo|voucher|jml|jumlah|item|no\.?\s*trans|www\.|\.com)/i;
const RC_DISC=/\b(diskon|disc|potongan|hemat|promo)\b/i;
let rcpt=null;
/* "12.500", "12,500", "12.500,00", "Rp12500" → 12500. Two-decimal cents are dropped (rupiah has none). */
function rcNum(raw){ let t=raw; if(/[.,]\d{2}$/.test(t)&&(/[.,]\d{3}[.,]\d{2}$/.test(t)||!/[.,]\d{3}/.test(t))) t=t.slice(0,-3); return parseInt(t.replace(/\D/g,''),10)||0; }
function rcTitle(s){ return s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()).trim(); }
function rcLev(a,b){ const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
/* Everyday Indonesian words that receipts use for each Essential. */
const RC_ALIASES={tea:['teh'],telur:['telor'],aqua:['air mineral'],creamer:['krimer'],vitamin:['vit'],
  sayur:['bayam','kangkung','sawi','wortel','tomat','brokoli','kentang','pisang','apel','jeruk'],bumbu:['saus','kecap','sambal','bumbu','garam','gula'],
  hairbodycare:['shampo','sampo','sabun','conditioner','lotion'],skincare:['serum','toner','moisturizer','sunscreen','facial'],bensin:['pertalite','pertamax']};
/* Suggest an Essential for a receipt line: whole word, word prefix, or one OCR typo away.
   Earlier words win ties ("Telur Ayam" is eggs, not chicken). Shown for review, never saved silently. */
function rcMatchEssential(name){
  const words=name.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>=3);
  let best=null, bestScore=0;
  essentials.forEach(e=>{
    const keys=[e.name,...e.name.toLowerCase().split(/[^a-z]+/).flatMap(w=>RC_ALIASES[w]||[])].join(' ').toLowerCase().split(/[^a-z]+/).filter(w=>w.length>=3);
    let score=0;
    keys.forEach(x=>words.forEach((w,pos)=>{
      let s=0;
      if(w===x) s=3; else if(x.length>=4&&w.length>=4&&(w.startsWith(x)||x.startsWith(w))) s=2; else if(x.length>=5&&rcLev(w,x)<=1) s=2;
      if(s) score=Math.max(score,s*10-pos);
    }));
    if(score>bestScore){ best=e; bestScore=score; }
  });
  return bestScore>=15? best : null;
}
/* Turn receipt text into item lines. Handles "NAME 2 x 6.250 12.500", "NAME 12.500",
   and two-line items (name on one line, "2 x 6.250 12.500" on the next). */
function parseReceipt(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.replace(/[|_]+/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  const items=[]; let pending=null, total=null;
  for(const line of lines){
    const nums=[...line.matchAll(/\d[\d.,]*\d|\d/g)];
    const last=nums[nums.length-1];
    const lastVal= last? rcNum(last[0]) : 0;
    if(/\btotal\b/i.test(line)&&!/sub\s*total|total\s*(item|qty|disc|hemat)/i.test(line)){ if(total==null&&lastVal>=100) total=lastVal; pending=null; continue; }
    if(RC_DATE.test(line)||RC_SKIP.test(line)){ pending=null; continue; }
    if(RC_DISC.test(line)){ if(lastVal>0&&items.length) items[items.length-1].amount=Math.max(0,items[items.length-1].amount-lastVal); continue; }
    const endsWithPrice= last && lastVal>=100 && !/[a-z]/i.test(line.slice(last.index+last[0].length));
    if(!endsWithPrice){ if((line.match(/[a-z]/gi)||[]).length>=3) pending=line; continue; }
    // Split "name" from the trailing block of quantities and prices.
    const tail=line.match(/(?:\s+(?:\d[\d.,]*|x|@|pcs?|bh|buah|rp\.?))+\s*$/i) || line.match(/^(?:(?:\d[\d.,]*|x|@|pcs?|bh|buah|rp\.?)\s*)+$/i);
    const namePart= tail? line.slice(0,tail.index).trim() : '';
    const vals=(tail?tail[0]:line).match(/\d[\d.,]*\d|\d/g).map(rcNum);
    const amount=vals[vals.length-1];
    let qty=1;
    if(vals.length>=3&&vals[0]>0&&vals[0]<100&&Math.abs(vals[0]*vals[vals.length-2]-amount)<=amount*0.02) qty=vals[0];
    else if(vals.length===2&&vals[0]>=100&&amount%vals[0]===0&&amount/vals[0]<100) qty=amount/vals[0];
    else if(vals.length===2&&vals[0]>0&&vals[0]<100) qty=vals[0];
    const name= (namePart.match(/[a-z]/gi)||[]).length>=2? namePart : pending;
    pending=null;
    if(!name) continue;
    items.push({name:rcTitle(name.replace(/^\d+\s+/,'')),qty,amount});
  }
  return {items,total};
}
function openReceipt(){
  rcpt={items:[],total:null,date:logState.date||todayISO(),accountId:logState.accountId,status:''};

}
function rcSetStatus(msg){ rcpt.status=msg; const el=document.getElementById('rcStatus'); if(el) el.textContent=msg; }
function rcApplyText(text){
  const {items,total}=parseReceipt(text);

  rcpt.items=items.map(it=>{ const e=rcMatchEssential(it.name); return {...it,include:true,essentialId:e?e.id:null,categoryId:e?e.categoryId:'cat_food'}; });

function rcReadPasted(){ const t=document.getElementById('rcText').value; if(!t.trim()){ rcSetStatus('Tempel teks struk dulu ya.'); return; } rcApplyText(t); }

function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(!tessLoading) tessLoading=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload=res; s.onerror=()=>{ tessLoading=null; rej(new Error('load')); }; document.head.appendChild(s); });

}
/* Scale to OCR-friendly width, grayscale and stretch contrast — helps faded thermal paper. */
async function rcPreprocess(file){
  const img=await createImageBitmap(file);
  const scale=Math.min(2.5,Math.max(1,1400/img.width)), w=Math.round(img.width*scale), h=Math.round(img.height*scale);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
  const d=ctx.getImageData(0,0,w,h), px=d.data, hist=new Array(256).fill(0);
  for(let i=0;i<px.length;i+=4){ const g=Math.round(px[i]*.299+px[i+1]*.587+px[i+2]*.114); px[i]=g; hist[g]++; }
  const n=w*h; let lo=0,hi=255,acc=0; for(;lo<255&&(acc+=hist[lo])<n*0.02;lo++); acc=0; for(;hi>0&&(acc+=hist[hi])<n*0.02;hi--);
  const span=Math.max(1,hi-lo);
  for(let i=0;i<px.length;i+=4){ const v=Math.max(0,Math.min(255,(px[i]-lo)*255/span)); px[i]=px[i+1]=px[i+2]=v; }
  ctx.putImageData(d,0,0); return c;
}
async function rcScanPhoto(file){
  if(!file) return;

    const canvas=await rcPreprocess(file);
    const {data}=await Tesseract.recognize(canvas,'ind+eng',{logger:m=>{ if(m.status==='recognizing text') rcSetStatus(`Membaca struk… ${Math.round(m.progress*100)}%`); }});

}

/* ===== CREDIT CARD STATEMENT (PDF) → review list → one expense per charge ===== */
const ST_MONTHS={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agt:8,agu:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};

const ST_AMT=/^-?(?:rp\.?\s*)?\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{2})?(?:\s*cr)?$/i;

const ST_RULES=[
  [/grab|gojek|gocar|blue\s*bird|taxi|kereta|kai\b|trip\.com|traveloka|tiket|agoda|airasia|garuda|citilink|lion|pertamina|shell|toll|parkir/i,'cat_transport'],
  [/anthropic|openai|netflix|spotify|apple\.com|google|youtube|icloud|microsoft|adobe|cursor|github|notion|canva/i,'cat_subs'],
  [/resto|cafe|coffee|kopi|starbucks|mcd|kfc|sosis|bakso|warung|food|makan|sushi|pizza|bakery|dining/i,'cat_food'],
  [/indomaret|alfamart|superindo|ranch|hypermart|lotte|transmart|carrefour|grocer/i,'cat_food'],
  [/pln|listrik|telkomsel|indihome|biznet|xl\b|pdam|ipl/i,'cat_utilities'],

const ST_FEE=/biaya|stamp\s*duty|meterai|annual\s*fee|iuran|bunga|interest|late\s*fee|denda/i;
const ST_SKIP=/pembayaran\s+kartu|payment\s+(thank|received)|tagihan\s+sebelumnya|previous\s+balance/i;
const ST_TOPUP=/gopay|ovo|dana\b|shopeepay|linkaja|top\s*up|topup/i;
let stmt=null, pdfjsLib=null;
async function loadPdfjs(){
  if(pdfjsLib) return pdfjsLib;

function stAmount(s){ const t=s.trim(), credit=/cr\s*$/i.test(t)||/^-/.test(t); const core=t.replace(/cr\s*$/i,'').replace(/^-|rp\.?/gi,'').trim();

/* Rebuild statement rows from positioned text. Each charge is anchored by a date at the left;

function parseStatementPages(pages){
  const txs=[]; let total=null;
  pages.forEach(items=>{
    const words=items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.x,y:i.y}));
    const anchors=[];
    words.filter(w=>stDate(w.s)).forEach(w=>{ // the first date on a row is the transaction date
      if(anchors.some(a=>Math.abs(a.y-w.y)<3)) return;
      const rowDates=words.filter(v=>Math.abs(v.y-w.y)<3&&stDate(v.s)).sort((a,b)=>a.x-b.x);
      anchors.push({y:w.y,date:stDate(rowDates[0].s),dateRight:rowDates[rowDates.length-1].x,desc:[],amt:null});

    const totalWord=words.find(w=>/^total$/i.test(w.s));
    if(totalWord){ const t=words.filter(w=>Math.abs(w.y-totalWord.y)<3&&ST_AMT.test(w.s)).pop(); if(t) total=stAmount(t.s).amount; }

  const rule=ST_RULES.find(([re])=>re.test(t.desc)); if(rule) categoryId=rule[1];
  if(t.credit||ST_SKIP.test(t.desc)){ include=false; note='Pembayaran / kredit — bukan pengeluaran'; }
  else if(ST_TOPUP.test(t.desc)&&!/grab/i.test(t.desc)){
    // A top-up is a transfer into one of your own accounts, not spending.
    const desc=t.desc.toLowerCase(), common=new Set(['wallet','dompet','main','utama','bank','rekening','tabungan','digital','card','kartu']);
    const w=accounts.find(a=>a.type!=='credit'&&a.name.toLowerCase().split(/[^a-z]+/).some(x=>x.length>=4&&!common.has(x)&&desc.includes(x)));
    if(w){ note=`Top-up ${w.name} — dicatat sebagai transfer, bukan pengeluaran`; topupTo='acc:'+w.id; }
    else { include=false; categoryId='cat_shopping'; note='Top-up e-wallet — tautkan ke rekening e-wallet, atau biarkan tidak dicentang'; }
  }
  else if(/installment|cicilan/i.test(t.desc)){ note='Cicilan — pastikan pembelian aslinya belum dicatat'; }
  else if(ST_FEE.test(t.desc)){ note='Biaya bank'; categoryId='cat_utilities'; }
  const dupTransfer= topupTo&&transactions.some(x=>x.type==='transfer'&&x.date===t.date&&x.amount===t.amount&&'acc:'+x.toAccountId===topupTo);
  if(include&&(dupTransfer||transactions.some(x=>x.type==='expense'&&x.date===t.date&&x.amount===t.amount))){ include=false; note='Mungkin sudah tercatat (tanggal & nominal sama)'; }
  if(fx) note=(note?note+' · ':'')+`${fx[1].toUpperCase()} ${fx[2]}`;
  // Suggest a link so the charge doesn't get counted twice (once here, once as a reserved bill/Essential).
  let link=topupTo;
  if(!t.credit&&!link){
    const b=billByName(name), e=b? null : rcMatchEssential(name), amt=(!b&&!e)? billByAmount(t.amount) : null;
    if(b){ link='bill:'+b.id; categoryId=b.categoryId; }
    else if(e){ link='ess:'+e.id; categoryId=e.categoryId; }
    else if(amt) note=(note?note+' · ':'')+`Nominal sama dengan tagihan "${amt.name}" — tautkan jika benar`; // hint only, not preselected
  }
  return {date:t.date,name,raw:t.desc,amount:t.amount,credit:t.credit,include,categoryId,note,link};
}

async function stReadFile(file,password){

    const lib=await loadPdfjs();
    const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),password:password||undefined}).promise;
    const pages=[];
    for(let i=1;i<=doc.numPages;i++){ const tc=await (await doc.getPage(i)).getTextContent(); pages.push(tc.items.map(it=>({str:it.str,x:it.transform[4],y:it.transform[5]}))); }
    if(!stmt||!document.getElementById('stStatus')) return; // screen was closed meanwhile
    const {txs,total}=parseStatementPages(pages);

function stSave(){
  const sel=stSelected();
  if(!sel.length){ toast('Tidak ada transaksi terpilih.'); return; }
  const snap=snapshot(), stamp=Date.now(), accId=stmt.accountId;
  const newTx=[]; // plain charges; bill-linked ones are recorded through recordBillPayment
  sel.forEach((it,i)=>{
    const title=it.name.trim()||'Transaksi kartu', [kind,id]=(it.link||'').split(':');
    const bill= kind==='bill'? recurringItems.find(r=>r.id===id) : null, ess= kind==='ess'? essentials.find(e=>e.id===id) : null;
    if(bill){ recordBillPayment(bill,it.amount,accId,it.date,{title,tag:'#kartu-kredit'}); return; }
    if(kind==='acc'&&accById(id)&&id!==accId){
      const moves=[{id:accId,amount:-it.amount},{id,amount:it.amount}]; moves.forEach(m=>adjBalance(m.id,m.amount));
      newTx.push({id:`tx_cc_${stamp}_${i}`,date:it.date,title,amount:it.amount,type:'transfer',categoryId:null,accountId:accId,toAccountId:id,pocketId:null,moves,tag:'#transfer'}); return;
    }

    adjBalance(accId,-t.amount); newTx.push(t);
  });
  transactions=[...newTx,...transactions].sort((a,b)=>b.date.localeCompare(a.date));
  const sum=sel.reduce((s,it)=>s+it.amount,0);
  stmt=null; closeModal(); render();
  toastUndo(`${sel.length} transaksi kartu kredit tersimpan (${fmt(sum)}).`,snap);
}

/* Recurring */
/* An upcoming bill this payment probably belongs to: a word of the bill name (4+ letters) in the
   text, or — if no name matches — exactly the bill's expected amount. Suggested only, never applied silently. */
const BILL_STOP=new Set(['bayar','bayaran','tagihan','cicilan','bulanan','bulan','iuran','biaya','bank','rumah','langganan','paket','sewa','pembayaran','payment','monthly','bill','home','card','kartu','kredit']);
const billWords=t=>String(t||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>=4&&!BILL_STOP.has(w));
function billByName(text){ const words=billWords(text); return words.length? recurringItems.filter(r=>r.status==='upcoming').find(r=>billWords(r.name).some(w=>words.includes(w)))||null : null; }
function billByAmount(amount){ return amount>0? recurringItems.filter(r=>r.status==='upcoming').find(r=>r.expectedAmount===amount)||null : null; }
function billSuggestion(text,amount){ return billByName(text)||billByAmount(amount); }
/* Records paying `item`. Only a payment dated in the current month marks this month's bill as paid;
   a late payment for last month is saved as history and leaves this month's bill reserved. */
function recordBillPayment(item,amt,accId,date,extra){
  const txId='tx_rec_'+Date.now()+Math.random().toString(36).slice(2,5);
  const forMonth= inCycle({date})? billCycleMonth(item) : date.slice(0,7), thisMonth= forMonth===billCycleMonth(item);
  adjBalance(accId,-amt);
  const tx={id:txId,date,title:item.name,amount:amt,type:'expense',categoryId:item.categoryId,accountId:accId,tag:'#recurring',pocketId:null,recurringId:item.id,forMonth,...(extra||{})};
  transactions=[tx,...transactions].sort((a,b)=>b.date.localeCompare(a.date));
  if(thisMonth&&item.status!=='paid') recurringItems=recurringItems.map(r=> r.id===item.id? {...r,status:'paid',actualAmount:amt,txId,accountId:accId,statusMonth:forMonth}:r);
  return thisMonth;
}
let payingId=null;
function openPayModal(id){
  if(!accounts.length){ toast('Tambahkan rekening dulu di Pengaturan.'); goTab('settings'); return; }
  const item=recurringItems.find(r=>r.id===id); if(!item) return; payingId=id;
  const body=`<p style="font-size:13px;margin:0 0 12px"><strong>${esc(item.name)}</strong><br><span style="color:var(--muted);font-size:12px">Jatuh tempo ${billCycleDue(item).toLocaleDateString('id-ID',{day:'numeric',month:'short'})} • Expected ${fmt(item.expectedAmount)} • ${esc(item.note||'')}</span></p>

  <div class="field"><label for="payDate">Tanggal bayar</label><input id="payDate" type="date" value="${esc((transactions.find(t=>t.id===item.txId)||{}).date||todayISO())}" max="${todayISO()}"></div>
  <div class="field"><label for="payAcc">Bayar dari rekening</label><select id="payAcc">${accounts.map(a=>`<option value="${a.id}" ${(item.accountId||mainAccountId())===a.id?'selected':''}>${esc(a.name)} — ${fmt(a.balance)}</option>`).join('')}</select></div>
  <p style="font-size:11px;color:var(--muted);margin:0">Selisih dari expected akan langsung terlihat sebagai “Hemat” atau “Over” di daftar tagihan.</p>`;
  modalShell('Tandai Tagihan Lunas', body, `<button class="btn btn-emerald" style="width:100%;padding:12px" onclick="confirmPay()">Konfirmasi Lunas</button>`);

function confirmPay(){
  if(!accById(document.getElementById('payAcc').value)){ toast('Pilih rekening pembayaran.'); return; }
  const item=recurringItems.find(r=>r.id===payingId); if(!item) return;
  const amt=parseAmt(document.getElementById('payAmt').value); const accId=document.getElementById('payAcc').value;
  if(amt<=0){ toast('Nominal harus lebih dari nol.'); return; }
  const rawDate=document.getElementById('payDate').value, date=/^\d{4}-\d{2}-\d{2}$/.test(rawDate)? rawDate : todayISO();
  if(date>todayISO()){ toast('Tanggal tidak boleh di masa depan.'); return; }
  const snap=snapshot();
  const linked= item.status==='paid'&&item.txId? transactions.find(t=>t.id===item.txId) : null;
  if(linked){
    // Edit an existing payment: move the money from the old account/amount to the new one, and keep a single transaction.
    adjBalance(linked.accountId,linked.amount); adjBalance(accId,-amt);
    const mon=billCycleMonth(item), inThisCycle=inCycle({date});
    transactions=transactions.map(t=> t.id===linked.id? {...t,amount:amt,accountId:accId,date,forMonth: inThisCycle? (t.forMonth||mon) : date.slice(0,7)}:t);
    if(!inThisCycle){
      // Now a payment for another month: keep it as history, this month's bill is reserved again.
      recurringItems=recurringItems.map(r=> r.id===item.id? {...r,status:'upcoming',actualAmount:null,txId:null,accountId:null}:r);
      closeModal(); render(); toastUndo(`Pembayaran "${item.name}" dipindah ke bulan lain — tagihan bulan ini kembali disisihkan.`,snap); return;
    }
    recurringItems=recurringItems.map(r=> r.id===item.id? {...r,actualAmount:amt,accountId:accId}:r);
  } else if(!recordBillPayment(item,amt,accId,date)){
    closeModal(); render(); toastUndo(`Pembayaran "${item.name}" dicatat untuk bulan lalu — tagihan bulan ini tetap disisihkan.`,snap); return;
  }
  closeModal(); render(); toastUndo(`"${item.name}" ditandai lunas: ${fmt(amt)}`,snap);
}
function toggleRecurring(id,next){
  const item=recurringItems.find(r=>r.id===id); if(!item) return;
  const snap=snapshot();
  if(item.status==='paid'){
    // Undo the payment exactly: refund the account that paid and remove its transaction.
    const tx=transactions.find(t=>t.id===item.txId);
    if(tx){ reverseTx(tx); transactions=transactions.filter(t=>t.id!==tx.id); }
  }
  const cm=billCycleMonth(item), keep=(item.skippedMonths||[]).filter(m=>m!==cm&&m>=isoDate(new Date(today().getFullYear(),today().getMonth()-3,1)).slice(0,7));
  recurringItems=recurringItems.map(r=> r.id===id? {...r,status:next,actualAmount:null,txId:null,accountId:null,statusMonth:cm,skippedMonths: next==='skipped'? [...keep,cm] : keep}:r);
  render(); toastUndo(next==='skipped'?`"${item.name}" dilewati bulan ini — ${fmt(item.expectedAmount)} bebas.`:`"${item.name}" dikembalikan ke Upcoming.`,snap);
}
