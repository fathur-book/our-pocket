  if(id) essentials=essentials.map(e=> e.id===id? {...e,...data}:e);
  else essentials=[...essentials,{id:newId('ess'),...data}];
  settingsSaved(id?`"${name}" diperbarui.`:`"${name}" ditambahkan ke Essentials.`,snap);
}
function setEssPlan(next){ const p=essPlan(); settings={...settings,essPlan:{cycle:p.cycle,skip:p.skip,qty:p.qty,...next}}; }
function toggleEssPause(){
  const snap=snapshot(), on=!essPaused(); setEssPlan({skip:on}); render();
  toastUndo(on?'Essentials dilewati periode ini — anggarannya dilepas ke Safe-to-Spend.':'Essentials aktif lagi untuk periode ini.',snap);
}
function openEssQty(id){
  const e=essentials.find(x=>x.id===id); if(!e) return;
  const cur=planQtyOf(e);
  modalShell('Kebutuhan periode ini', `<p class="rc-help" style="margin:0 0 12px"><b>${esc(e.name)}</b> — biasanya ${e.targetQty}x × ${fmt(e.unitPrice)}. Ubah hanya untuk periode gajian ini; periode berikutnya kembali ke ${e.targetQty}x. Isi 0 untuk melewati item ini.</p>
  <div class="field"><label for="eqQty">Berapa kali periode ini</label><input id="eqQty" type="number" inputmode="numeric" min="0" max="99" value="${cur}"></div>`,
  `<div style="display:flex;gap:8px">${cur!==e.targetQty?`<button class="btn" style="flex:1;padding:12px" onclick="saveEssQty('${id}',true)">Kembali ke ${e.targetQty}x</button>`:''}<button class="btn btn-emerald" style="flex:1;padding:12px" onclick="saveEssQty('${id}')">Simpan</button></div>`);
  const el=document.getElementById('eqQty'); el.focus(); el.select();
}
function saveEssQty(id,reset){
  const e=essentials.find(x=>x.id===id); if(!e) return;
  const raw=parseInt(fv('eqQty'),10);
  if(!reset&&(!Number.isInteger(raw)||raw<0)){ toast('Isi angka 0 atau lebih.'); return; }
  const q=reset? e.targetQty : Math.min(99,raw), snap=snapshot(), qty={...essPlan().qty};
  if(q===e.targetQty) delete qty[id]; else qty[id]=q;
  setEssPlan({qty});
  settingsSaved(q===0?`"${e.name}" dilewati periode ini.`:q===e.targetQty?`"${e.name}" kembali ke ${q}x.`:`"${e.name}" periode ini: ${q}x (biasanya ${e.targetQty}x).`,snap);
}
function deleteEssential(id){
  const e=essentials.find(x=>x.id===id); if(!e) return;
  const snap=snapshot(); essentials=essentials.filter(x=>x.id!==id); render(); toastUndo(`"${e.name}" dihapus dari Essentials.`,snap);
}

function settingsList(title,sub,addLabel,addFn,rows,empty){
  return `<div class="card"><div class="set-head"><div><h3>${title}</h3><p class="sub">${sub}</p></div><button class="btn btn-dark btn-sm" onclick="${addFn}">${addLabel}</button></div>
  ${rows.length? rows.join('') : `<p class="set-empty">${empty}</p>`}</div>`;
}
const setRow=(main,meta,editFn,delFn)=>`<div class="set-row"><div style="min-width:0"><strong>${main}</strong><div class="set-meta">${meta}</div></div><div class="set-actions"><button class="btn btn-sm" onclick="${editFn}">Ubah</button><button class="icon-btn" aria-label="Hapus" onclick="${delFn}">🗑</button></div></div>`;
function renderSettings(){
  document.getElementById('view-settings').innerHTML=`<div class="set-grid">
  <div class="card wide"><div class="set-head"><div><h3>Gajian</h3><p class="sub">Safe-to-Spend menyisihkan kebutuhan sampai tanggal ini.</p></div><button class="btn btn-sm" onclick="openPaydayModal()">Ubah</button></div><p style="margin:0;font-size:14px">Setiap tanggal <strong>${settings.payday}</strong></p></div>
  <div class="card wide"><div class="set-head"><div><h3>Tampilan</h3><p class="sub">Tema terang atau gelap. Otomatis mengikuti pengaturan perangkat.</p></div></div>
    <div class="seg" role="group" aria-label="Tema" style="flex-wrap:nowrap">${[['auto','Otomatis'],['light','Terang'],['dark','Gelap']].map(([v,l])=>`<button class="${getTheme()===v?'active':''}" aria-pressed="${getTheme()===v}" onclick="setTheme('${v}');renderSettings();refreshIcons()">${l}</button>`).join('')}</div></div>
  ${settingsList('Rekening & Kartu','Semua rekening, e-wallet dan kartu kredit yang kamu punya.','+ Rekening','openAccountForm()',
    accounts.map(a=>setRow(esc(a.name),`${esc((ACC_TYPES[a.type]||ACC_TYPES.bank).label)} · ${fmt(a.balance)}`,`openAccountForm('${a.id}')`,`deleteAccount('${a.id}')`)),
    'Belum ada rekening. Tambahkan rekening tempat gaji masuk terlebih dulu.')}
  ${settingsList('Pocket Tabungan','Tabungan dengan target, dipisahkan dari uang belanja.','+ Pocket','openPocketForm()',
    pockets.map(p=>setRow(esc(p.name),`${fmt(p.currentAmount)} dari ${fmt(p.targetAmount)}${p.targetDate?' · target '+esc(p.targetDate):''}`,`openPocketForm('${p.id}')`,`deletePocket('${p.id}')`)),
    'Belum ada pocket.')}
  ${settingsList('Tagihan Rutin','Tagihan bulanan dengan tanggal jatuh tempo.','+ Tagihan','openBillForm()',
    recurringItems.map(r=>setRow(esc(r.name),`Tgl ${r.dueDay} · ${fmt(r.expectedAmount)}`,`openBillForm('${r.id}')`,`deleteBill('${r.id}')`)),
    'Belum ada tagihan rutin.')}
  ${settingsList('Daftar Essentials','Belanja kebutuhan rutin per bulan.','+ Item','openEssentialForm()',
    essentials.map(e=>setRow(esc(e.name),`${fmt(e.unitPrice)} × ${e.targetQty}/bulan = ${fmt(e.unitPrice*e.targetQty)}`,`openEssentialForm('${e.id}')`,`deleteEssential('${e.id}')`)),
    'Belum ada item Essentials.')}
  </div>`;
}
const SETUP_STEPS=[
  {id:'acc',  title:'Tambah rekening', sub:'Rekening tempat gaji masuk, e-wallet, dan kartu kredit.', done:()=>accounts.length>0, act:'openAccountForm()', optional:false},
  {id:'opening',title:'Catat saldo awal', sub:'Uang yang bisa dibelanjakan saat ini, supaya Safe-to-Spend mulai dari angka yang benar.', done:()=>!!openingTx(), act:'openOpeningBalance()', optional:false},
  {id:'payday',title:'Atur tanggal gajian', sub:'Safe-to-Spend dihitung sampai tanggal ini.', done:()=>!!settings.paydaySet, act:'openPaydayModal()', optional:false},
  {id:'bills',title:'Tambah tagihan rutin', sub:'Kos, internet, listrik, langganan…', done:()=>recurringItems.length>0, act:'openBillForm()', optional:true},
  {id:'ess',  title:'Buat daftar Essentials', sub:'Belanja kebutuhan bulanan (beras, telur…).', done:()=>essentials.length>0, act:'openEssentialForm()', optional:true},
  {id:'pock', title:'Buat saving pocket', sub:'Dana darurat, liburan, atau target lain.', done:()=>pockets.length>0, act:'openPocketForm()', optional:true},
];
function setupState(){ const skip=settings.setupSkip||[]; return SETUP_STEPS.map(st=>({...st,isDone:st.done(),skipped:skip.includes(st.id)})); }
function setupComplete(){ return setupState().every(st=>st.isDone||st.skipped); }
function skipSetup(id){ const snap=snapshot(); settings={...settings,setupSkip:[...new Set([...(settings.setupSkip||[]),id])]}; render(); toastUndo('Langkah dilewati — bisa diatur kapan saja di Pengaturan.',snap); }
function dismissSetup(){ const snap=snapshot(); settings={...settings,setupDismissed:true}; render(); toastUndo('Panduan disembunyikan.',snap); }
function renderSetupChecklist(){
  const st=setupState(), done=st.filter(x=>x.isDone||x.skipped).length, next=st.find(x=>!x.isDone&&!x.skipped);
  return `<div class="card setup"><div class="set-head"><div><h3>Siapkan FlowPocket</h3><p class="sub">${done} dari ${st.length} langkah selesai · angka Safe-to-Spend makin akurat di setiap langkah.</p></div>${accounts.length?'<button class="link-btn" onclick="dismissSetup()">Sembunyikan</button>':''}</div>
  <div class="bar sm" style="margin:4px 0 6px"><i style="width:${Math.round(done/st.length*100)}%"></i></div>
  ${st.map(x=>`<div class="setup-row ${x===next?'next':''}"><span class="setup-check ${x.isDone?'ok':''}">${x.isDone?'✓':x.skipped?'–':''}</span><div style="flex:1;min-width:0"><strong>${x.title}</strong><div class="set-meta">${x.skipped?'Dilewati':x.sub}</div></div>${x.isDone?'':`<span class="set-actions">${x.optional&&!x.skipped?`<button class="link-btn" style="font-size:12px" onclick="skipSetup('${x.id}')">Lewati</button>`:''}<button class="btn btn-sm ${x===next?'btn-dark':''}" onclick="${x.act}">${x.skipped?'Atur':'Mulai'}</button></span>`}</div>`).join('')}
  </div>`;
}
function renderWelcome(){
  return `<div class="card welcome"><div class="brand-icon" style="margin:0 auto 12px"><i data-lucide="wallet"></i></div>
  <h3 style="font-size:18px">Selamat datang di FlowPocket</h3>
  <p class="sub" style="max-width:420px;margin:6px auto 18px">Mulai dengan menambahkan rekening tempat gaji masuk. Setelah itu, atur tanggal gajian, pocket tabungan, tagihan, dan daftar Essentials kapan saja di Pengaturan.</p>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn btn-dark" onclick="openAccountForm()">+ Tambah rekening pertama</button><button class="btn" onclick="goTab('settings')">Buka Pengaturan</button></div></div>`;
}

/* Pockets */
let pocketCtx=null;
function openPocketAction(pid,mode,amount){
  if(needMainAccount()) return;
  const p=pockById(pid); if(!p) return; pocketCtx={pocket:p,mode};
  const body=`<p style="font-size:14px;margin:0 0 12px"><strong>${esc(p.name)}</strong> — terkumpul ${fmt(p.currentAmount)} dari target ${fmt(p.targetAmount)}<br><span style="color:var(--muted);font-size:13px">${mode==='topup'?'Dana dipindahkan dari rekening ke pocket ini — saldo rekening berkurang dan Safe-to-Spend turun.':'Pengeluaran dari pocket dipakai dari tabungan, jadi tidak mengurangi Safe-to-Spend.'}</span></p>
  <div class="field"><label for="pockAmt">Nominal (Rp)</label>${amtInput('pockAmt',amount??(mode==='topup'?p.monthlyHint:0),'250.000').replace('<input','<input class="big"')}</div>
  ${mode==='topup'?`<div class="field"><label for="pockAcc">Dari rekening</label>${accSelect('pockAcc')}</div>`:''}
  <div class="field"><label>Catatan (opsional)</label><input id="pockNote" type="text" placeholder="${mode==='topup'?'Top up '+esc(p.name):'Belanja dari '+esc(p.name)}"></div>`;
  modalShell(mode==='topup'?'Isi Pocket':'Pakai Dana Pocket', body, `<button class="btn btn-emerald" style="width:100%;padding:12px" onclick="confirmPocketAction()">${mode==='topup'?'Pindahkan ke Pocket':'Catat Pengeluaran dari Pocket'}</button>`);
}
function confirmPocketAction(){
  if(!pocketCtx) return; const amt=amtVal('pockAmt'); const note=document.getElementById('pockNote').value.trim(); const {pocket,mode}=pocketCtx;
  if(amt<=0){ toast('Nominal harus lebih dari nol.'); return; }
  if(mode!=='topup'&&pocket.currentAmount<=0){ toast(`${pocket.name} masih kosong — tidak ada dana untuk dipakai.`); return; }
  const snap=snapshot();
  if(mode==='topup'){ const mainId=fv('pockAcc'); rememberAccount(mainId); const moves=[{id:mainId,amount:-amt}]; adjBalance(mainId,-amt); pockets=pockets.map(p=> p.id===pocket.id? {...p,currentAmount:p.currentAmount+amt}:p); transactions=[{id:'tx_pock_'+Date.now(),date:todayISO(),title:note||`Tabung ke ${pocket.name}`,amount:amt,type:'transfer',categoryId:null,accountId:mainId,tag:'#pocket-save',pocketId:pocket.id,moves},...transactions]; }
  else { const deduct=Math.min(pocket.currentAmount,amt); pockets=pockets.map(p=> p.id===pocket.id? {...p,currentAmount:p.currentAmount-deduct}:p); transactions=[{id:'tx_pock_spend_'+Date.now(),date:todayISO(),title:note||`Belanja dari ${pocket.name}`,amount:deduct,type:'expense',categoryId:'cat_shopping',accountId:null,tag:'#'+pocket.name.toLowerCase().replace(/\s+/g,'-'),pocketId:pocket.id},...transactions]; } // paid from savings: no account changes
  closeModal(); render();
  toastUndo(mode==='topup'? `${fmt(amt)} masuk ke ${pocket.name}.` : `Tercatat pengeluaran ${fmt(Math.min(pocket.currentAmount,amt))} dari ${pocket.name}.`,snap,true);
}
function payoffCredit(){
  if(needMainAccount()) return;
  const amt=financialSummary().creditFloatHolding; if(amt<=0) return;
  modalShell('Lunasi Kartu Kredit', `<p class="rc-help" style="margin:0 0 12px">Catat pelunasan semua kartu kredit sebesar <b>${fmt(amt)}</b>. Lakukan ini setelah kamu benar-benar membayar tagihannya di aplikasi bank.</p>
  <div class="field"><label for="payoffAcc">Dibayar dari rekening</label>${accSelect('payoffAcc')}</div>`,
  `<button class="btn btn-emerald" style="width:100%;padding:12px" onclick="confirmPayoff()">Catat pelunasan ${fmt(amt)}</button>`);
}
function confirmPayoff(){
  const amt=financialSummary().creditFloatHolding, main=accById(fv('payoffAcc')); closeModal(); if(amt<=0||!main) return;
  rememberAccount(main.id);
  const snap=snapshot();
  const creditPayoff=accounts.filter(a=>a.type==='credit'&&a.balance<0).map(a=>({id:a.id,amount:-a.balance}));
  accounts=accounts.map(a=>{ if(a.id===main.id) return {...a,balance:a.balance-amt}; if(a.type==='credit'&&a.balance<0) return {...a,balance:0}; return a; }); // cards in credit (refunds) keep their balance
  transactions=[{id:'tx_cc_'+Date.now(),date:todayISO(),title:'Pelunasan kartu kredit',amount:amt,type:'transfer',categoryId:null,accountId:main.id,tag:'#cc-payoff',pocketId:null,creditPayoff},...transactions];
  render(); toastUndo(`Kartu kredit lunas: ${fmt(amt)} dibayar dari ${main.name}.`,snap);
}
function deleteTx(id){
  const tx=transactions.find(t=>t.id===id); if(!tx) return;
  if(tx.type==='transfer'&&tx.pocketId&&!tx.fromPocket){ const p=pockById(tx.pocketId); if(p&&p.currentAmount<tx.amount){ toast(`${p.name} tinggal ${fmt(p.currentAmount)} — sebagian dana ini sudah dipakai. Hapus dulu pengeluaran dari pocket tersebut.`); return; } }
  const snap=snapshot();
  reverseTx(tx);
  transactions=transactions.filter(t=>t.id!==id);
  render(); toastUndo(`Entri "${tx.title}" dihapus — saldo terkait dikembalikan.`,snap);
}
/* Edit a Riwayat entry: undo its old effect (reverseTx), then apply the edited copy (applyTx).
   Transfers keep their route — only amount, title, date and tag change; to change the route, delete and log it again. */
function openTxEdit(id){
  const tx=transactions.find(t=>t.id===id); if(!tx) return;
  const isTf=tx.type==='transfer', fixedAmt=Array.isArray(tx.creditPayoff);
  const cats=categories.filter(c=> tx.type==='income'? c.type==='income'&&c.id!=='cat_opening' : c.type==='expense');
  const body=`
    <div class="field"><label for="teAmt">Nominal (Rp)</label>${fixedAmt? `<div style="font-weight:700">${fmt(tx.amount)}</div><p class="rc-help" style="margin:4px 0 0">Nominal pelunasan kartu tidak bisa diubah — hapus lalu catat ulang bila perlu.</p>` : amtInput('teAmt',tx.amount).replace('<input','<input class="big"')}</div>
    <div class="field"><label for="teTitle">Judul / Catatan</label><input id="teTitle" type="text" value="${esc(tx.title)}"></div>
    <div class="field"><label for="teDate">Tanggal</label><input id="teDate" type="date" value="${esc(tx.date)}" max="${todayISO()}"></div>
    ${isTf?'':`<div class="field"><label for="teCat">Kategori</label><select id="teCat">${cats.map(c=>`<option value="${c.id}" ${tx.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="teAcc">Rekening</label><select id="teAcc">${accounts.map(a=>`<option value="${a.id}" ${tx.accountId===a.id?'selected':''}>${esc(a.name)} — ${fmt(a.balance)}</option>`).join('')}</select></div>`}
    <div class="field"><label for="teTag">Tag (opsional)</label><input id="teTag" type="text" value="${esc(tx.tag||'')}"></div>
    <p style="font-size:12px;color:var(--muted);line-height:1.5;margin:0">${tx.adjust?`Penyesuaian ini ${tx.moves[0].amount>0?'menambah':'mengurangi'} saldo — ubah nominalnya di sini, atau hapus lalu sesuaikan ulang untuk arah sebaliknya.`:isTf?'Rute transfer (dari/ke) tetap. Untuk mengubahnya, hapus entri ini lalu catat ulang.':'Saldo rekening, pocket, dan tagihan terkait ikut disesuaikan.'}</p>`;
  modalShell('Ubah transaksi', body, `<button class="btn btn-emerald" style="width:100%;padding:13px;font-size:15px" onclick="saveTxEdit('${tx.id}')">Simpan perubahan</button>`);
}
function saveTxEdit(id){
  const tx=transactions.find(t=>t.id===id); if(!tx) return;
  const isTf=tx.type==='transfer', amt= Array.isArray(tx.creditPayoff)? tx.amount : amtVal('teAmt');
  if(amt<=0){ toast('Masukkan nominal lebih dari nol dulu ya.'); return; }
  const raw=fv('teDate'), date=/^\d{4}-\d{2}-\d{2}$/.test(raw)? raw : tx.date;
  if(date>todayISO()){ toast('Tanggal tidak boleh di masa depan.'); return; }
  const accountId= isTf? tx.accountId : fv('teAcc');
  if(!accById(accountId)){ toast('Pilih rekening dulu.'); return; }
  const p= isTf&&tx.pocketId? pockById(tx.pocketId) : null;
  if(p&&amt!==tx.amount){
    if(tx.fromPocket&&amt>p.currentAmount+tx.amount){ toast(`Saldo ${p.name} hanya ${fmt(p.currentAmount+tx.amount)}.`); return; }
    if(!tx.fromPocket&&p.currentAmount<tx.amount){ toast(`${p.name} tinggal ${fmt(p.currentAmount)} — sebagian dana ini sudah dipakai, jadi nominalnya tidak bisa diubah.`); return; }
  }
  const edited={...tx,amount:amt,date,accountId,title:fv('teTitle').trim()||tx.title,tag:fv('teTag').trim(),
    ...(isTf? {} : {categoryId:fv('teCat')}),
    ...(Array.isArray(tx.moves)? {moves:tx.moves.map(m=>({...m,amount:Math.sign(m.amount)*amt}))} : {})};
  const snap=snapshot();
  // A transfer into a pocket that was partly spent can't be reversed cleanly; when its amount is unchanged, don't touch balances.
  if(!isTf||amt!==tx.amount){ reverseTx(tx); applyTx(edited); }
  transactions=transactions.map(t=> t.id===id? edited : t).sort((a,b)=>b.date.localeCompare(a.date));
  closeModal(); render(); toastUndo(`Entri "${edited.title}" diperbarui.`,snap,true);
}

/* Nav wiring */
document.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click',()=>goTab(b.dataset.tab)));
document.getElementById('fabBtn').addEventListener('click',()=>{ logState=freshLogState(); openLogger(); });
/* The floating Catat button steps aside while scrolling down and comes back on scroll up or at the end of the page. */
(()=>{ const fab=document.getElementById('fabBtn'); let lastY=scrollY, queued=false;
  addEventListener('scroll',()=>{ if(queued) return; queued=true; requestAnimationFrame(()=>{ queued=false;
    const y=scrollY, end=y+innerHeight>=document.documentElement.scrollHeight-8;
    if(end) fab.classList.remove('away'); else if(Math.abs(y-lastY)>6) fab.classList.toggle('away',y>lastY&&y>80);
    if(Math.abs(y-lastY)>6||end) lastY=y; }); },{passive:true}); })();
document.getElementById('quickLogTop').addEventListener('click',()=>{ logState=freshLogState(); openLogger(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); else trapModalTab(e); });
render();
initCloud();
</script>
</body>
